<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request Access — Neurofoundry</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      background: #0f1113; 
      color: #e6e9ee; 
      margin: 0; 
      font-family: Inter, sans-serif;
      min-height: 100vh;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(11, 12, 14, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid #e0473c;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
      text-decoration: none;
      color: #e6e9ee;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #ff7b6e 0%, #e0473c 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      color: white;
      box-shadow: 0 4px 12px rgba(224, 71, 60, 0.3);
    }
    .links {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .navlink {
      color: #ccc;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.2s;
    }
    .navlink:hover { color: #e0473c; }
    .nav-item { position: relative; }
    .dropdown-toggle {
      background: none;
      border: none;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #ccc;
      font: 500 14px/1 Inter, sans-serif;
      transition: color 0.2s;
    }
    .dropdown-toggle:hover,
    .dropdown-toggle:focus-visible {
      color: #e0473c;
      outline: none;
    }
    .dropdown-caret {
      font-size: 11px;
      opacity: 0.7;
    }
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 200px;
      background: rgba(15, 17, 19, 0.96);
      border: 1px solid rgba(224, 71, 60, 0.25);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 50;
    }
    .dropdown::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      height: 10px;
    }
    .dropdown-menu a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      color: #d6d6d6;
      text-decoration: none;
      font-size: 13px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .dropdown-menu a:hover {
      background: rgba(224, 71, 60, 0.15);
      color: #fff;
    }
    .dropdown:hover .dropdown-menu,
    .dropdown:focus-within .dropdown-menu {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 18px;
      border-radius: 8px;
      font: 600 13px/1 Inter, sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: 2px solid transparent;
    }
    .btn.primary {
      background: linear-gradient(180deg, #ff7b6e 0%, #e9584d 48%, #d23d33 100%);
      border-color: #a2362f;
      color: #fff;
      box-shadow: 0 4px 12px rgba(224, 71, 60, 0.3);
    }
    .btn.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(224, 71, 60, 0.4);
    }
    main {
      margin-top: 64px;
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 18px;
      position: relative;
      overflow: hidden;
    }
    main::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 30% 40%, rgba(224, 71, 60, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 70% 60%, rgba(255, 123, 110, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }
    .signup-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: linear-gradient(135deg, rgba(15, 17, 19, 0.95), rgba(10, 11, 13, 0.98));
      border: 1px solid rgba(224, 71, 60, 0.2);
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
    }
    .signup-header {
      text-align: center;
      margin-bottom: 36px;
    }
    .signup-label {
      display: inline-block;
      margin-bottom: 16px;
      background: rgba(224,71,60,0.15);
      border: 1px solid rgba(224,71,60,0.3);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 600;
      color: #ff9b93;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    h1 {
      font-size: 36px;
      font-weight: 900;
      margin: 0 0 12px 0;
      background: linear-gradient(135deg, #fff 0%, #ffc9c3 45%, #ff7a66 70%, #e0473c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }
    .signup-subtitle {
      color: #9aa3ad;
      font-size: 14px;
      margin: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #c9d0d8;
    }
    label .required {
      color: #e0473c;
      margin-left: 2px;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(18, 20, 23, 0.8);
      border: 1px solid #2a2f34;
      border-radius: 10px;
      color: #e6e9ee;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #e0473c;
      background: rgba(18, 20, 23, 0.95);
      box-shadow: 0 0 0 3px rgba(224, 71, 60, 0.15);
    }
    input::placeholder {
      color: #6a7178;
    }
    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 24px 0;
    }
    .checkbox-group input[type="checkbox"] {
      width: auto;
      margin-top: 3px;
      cursor: pointer;
    }
    .checkbox-group label {
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      color: #9aa3ad;
      cursor: pointer;
    }
    .checkbox-group a {
      color: #ff7b6e;
      text-decoration: none;
      font-weight: 600;
    }
    .checkbox-group a:hover {
      color: #e0473c;
      text-decoration: underline;
    }
    .submit-btn {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(180deg, #ff7b6e 0%, #e9584d 48%, #d23d33 100%);
      border: 2px solid #a2362f;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(224, 71, 60, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(224, 71, 60, 0.4);
    }
    .submit-btn:active {
      transform: translateY(0);
    }
    .divider {
      text-align: center;
      margin: 28px 0;
      position: relative;
    }
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #2a2f34;
    }
    .divider span {
      position: relative;
      background: linear-gradient(135deg, rgba(15, 17, 19, 0.95), rgba(10, 11, 13, 0.98));
      padding: 0 16px;
      color: #6a7178;
      font-size: 13px;
      font-weight: 600;
    }
    .social-buttons {
      display: grid;
      gap: 12px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      background: rgba(28, 18, 16, 0.5);
      border: 1px solid rgba(98, 48, 45, 0.4);
      border-radius: 10px;
      color: #c9d0d8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .social-btn:hover {
      background: rgba(28, 18, 16, 0.8);
      border-color: rgba(224, 71, 60, 0.4);
      transform: translateY(-1px);
    }
    .login-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #9aa3ad;
    }
    .login-link a {
      color: #ff7b6e;
      text-decoration: none;
      font-weight: 600;
    }
    .login-link a:hover {
      color: #e0473c;
      text-decoration: underline;
    }
    .error-message {
      display: none;
      padding: 12px 16px;
      background: rgba(224, 71, 60, 0.1);
      border: 1px solid rgba(224, 71, 60, 0.3);
      border-radius: 8px;
      color: #ff9b93;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .error-message.show {
      display: block;
    }
    @media (max-width: 640px) {
      .signup-container {
        padding: 32px 24px;
      }
      h1 { font-size: 28px; }
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a href="home.html" class="brand">
        <div class="brand-icon">N</div>
        <span>NEUROFOUNDRY</span>
      </a>
      <nav class="links">
        <a class="navlink" href="home.html">Home</a>
        <a class="navlink" href="https://forge.theneurofoundry.com/">Forge</a>
        <div class="nav-item dropdown">
          <button class="dropdown-toggle" type="button">
            Archives <span class="dropdown-caret">v</span>
          </button>
          <div class="dropdown-menu">
            <a href="technology.html">Technology</a>
            <a href="downloads.html">Downloads</a>
            <a href="button2.html">Manifesto</a>
            <a href="neurofoundry-report.html">Report</a>
          </div>
        </div>
        <a class="navlink" href="technology.html">Technology</a>
        <a class="btn primary" href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="signup-container">
      <div class="signup-header">
        <div class="signup-label">🔥 Early Access</div>
        <h1>Request Access</h1>
        <p class="signup-subtitle">Join the architects building the future of AI</p>
      </div>

      <div class="error-message" id="errorMessage">
        Please fill in all required fields correctly.
      </div>

      <form id="signupForm" onsubmit="handleSignup(event)">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name <span class="required">*</span></label>
            <input type="text" id="firstName" name="firstName" placeholder="Your first name" required>
          </div>
          <div class="form-group">
            <label for="lastName">Last Name <span class="required">*</span></label>
            <input type="text" id="lastName" name="lastName" placeholder="Your last name" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Neural Link (Email) <span class="required">*</span></label>
          <input type="email" id="email" name="email" placeholder="architect@yourcompany.com" required>
        </div>

        <div class="form-group">
          <label for="username">Codename <span class="required">*</span></label>
          <input type="text" id="username" name="username" placeholder="Choose your identifier" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password">Access Key <span class="required">*</span></label>
            <input type="password" id="password" name="password" placeholder="Min. 8 characters" required minlength="8">
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Key <span class="required">*</span></label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Verify access key" required>
          </div>
        </div>

        <div class="form-group">
          <label for="accountType">Access Tier <span class="required">*</span></label>
          <select id="accountType" name="accountType" required>
            <option value="">Select your tier</option>
            <option value="individual">Individual Architect</option>
            <option value="business">Business Operations</option>
            <option value="enterprise">Enterprise Division</option>
            <option value="developer">Developer Access</option>
          </select>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">
            I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a> <span class="required">*</span>
          </label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="newsletter" name="newsletter">
          <label for="newsletter">
            Send me updates about new features and AI innovations
          </label>
        </div>

        <button type="submit" class="submit-btn">🔥 Initialize My Access</button>
      </form>

      <div class="divider">
        <span>OR AUTHENTICATE VIA</span>
      </div>

      <div class="social-buttons">
        <button class="social-btn" onclick="socialSignup('google')">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M19.6 10.23c0-.82-.1-1.42-.25-2.05H10v3.72h5.5c-.15.96-.74 2.31-2.04 3.22v2.45h3.16c1.89-1.73 2.98-4.3 2.98-7.34z"/>
            <path d="M10 20c2.7 0 4.96-.89 6.62-2.42l-3.16-2.45c-.86.58-1.97.92-3.46.92-2.65 0-4.92-1.77-5.73-4.15H1.07v2.52C2.72 17.75 6.09 20 10 20z"/>
            <path d="M4.27 11.9c-.25-.76-.25-1.58 0-2.34V7.04H1.07c-.82 1.58-.82 3.34 0 4.92l3.2-2.06z"/>
            <path d="M10 3.88c1.45 0 2.73.5 3.72 1.46l2.73-2.73C14.46.99 12.2 0 10 0 6.09 0 2.72 2.25 1.07 5.58l3.2 2.46c.8-2.38 3.07-4.16 5.73-4.16z"/>
          </svg>
          Sign up with Google
        </button>
        <button class="social-btn" onclick="socialSignup('github')">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10 0C4.477 0 0 4.477 0 10c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0110 4.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C17.138 18.163 20 14.418 20 10c0-5.523-4.477-10-10-10z"/>
          </svg>
          Sign up with GitHub
        </button>
      </div>

      <div class="login-link">
        Already an Architect? <a href="login.html">Access your workspace</a>
      </div>
    </div>
  </main>

  <script>
    function handleSignup(event) {
      event.preventDefault();
      
      const form = event.target;
      const password = form.password.value;
      const confirmPassword = form.confirmPassword.value;
      const errorMessage = document.getElementById('errorMessage');
      
      if (password !== confirmPassword) {
        errorMessage.textContent = 'Access keys do not match!';
        errorMessage.classList.add('show');
        return false;
      }
      
      if (password.length < 8) {
        errorMessage.textContent = 'Access key must be at least 8 characters.';
        errorMessage.classList.add('show');
        return false;
      }
      
      if (!form.terms.checked) {
        errorMessage.textContent = 'Please accept the Terms of Service and Privacy Policy.';
        errorMessage.classList.add('show');
        return false;
      }
      
      errorMessage.classList.remove('show');
      
      const formData = {
        firstName: form.firstName.value,
        lastName: form.lastName.value,
        email: form.email.value,
        username: form.username.value,
        password: password,
        accountType: form.accountType.value,
        newsletter: form.newsletter.checked
      };
      
      console.log('Initialization data:', formData);
      alert('Access granted! Welcome to the Foundry, Architect. This would normally connect to backend systems.');
      
      return false;
    }
    
    function socialSignup(provider) {
      alert(`Authenticating via ${provider}... OAuth flow would redirect here.`);
    }
  </script>
  <script src="shared/page-transitions.js"></script>
  <script src="shared/micro-interactions.js"></script>
  <script src="chatbot-component.js"></script>
  <script src="embers-effect.js"></script>
</body>
</html>
