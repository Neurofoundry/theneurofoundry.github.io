app = "nf-auth-clean-20260219"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  LOCAL_DB_FILE = "/data/auth-users.json"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "get"
  timeout = "5s"
  path = "/api/health"

[[mounts]]
  source = "auth_data"
  destination = "/data"
