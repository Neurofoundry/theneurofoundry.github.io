<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neurofoundry — The Engine is the Mind</title>
  <meta name="description" content="Enter the mind. Neurofoundry brings AI-powered scene direction, intelligent agents, and next-gen creative tools.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- OpenTelemetry (UMD builds) - dev only, safe guards in tracing-init.js -->
  <script src="https://unpkg.com/@opentelemetry/sdk-trace-web/build/umd/index.min.js"></script>
  <script src="https://unpkg.com/@opentelemetry/exporter-trace-otlp-http/build/umd/index.min.js"></script>
  <script src="https://unpkg.com/@opentelemetry/instrumentation-document-load/build/umd/index.min.js"></script>
  <script src="https://unpkg.com/@opentelemetry/instrumentation-fetch/build/umd/index.min.js"></script>
  <script src="https://unpkg.com/@opentelemetry/instrumentation-xml-http-request/build/umd/index.min.js"></script>
  <script src="tracing/tracing-init.js"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: #0a0a0a;
      overflow: hidden;
      height: 100%;
      font-family: 'Orbitron', sans-serif;
      color: #e0473c;
    }

    body {
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    /* Skip button */
    #skipBtn {
      position: fixed;
      bottom: 32px;
      right: 32px;
      padding: 12px 24px;
      background: rgba(224, 71, 60, 0.2);
      border: 1px solid rgba(224, 71, 60, 0.4);
      border-radius: 8px;
      color: #ff9b93;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      z-index: 10000;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
    }

    #skipBtn:hover {
      background: rgba(224, 71, 60, 0.4);
      border-color: #e0473c;
      transform: translateY(-2px);
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       NEW ELEMENTS - Tech Showcase Panels
    ═══════════════════════════════════════════════════════════════════════════ */
    
    /* Hex Grid Background */
    #hexGrid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      opacity: 0.08;
      pointer-events: none;
    }

    /* Scanline Effect */
    #scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9998;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.05) 0px,
        rgba(0, 0, 0, 0.05) 1px,
        transparent 1px,
        transparent 2px
      );
      opacity: 0.4;
    }

    /* Version Badge */
    #versionBadge {
      position: fixed;
      top: 32px;
      left: 32px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: #444;
      letter-spacing: 1px;
      z-index: 10001;
      opacity: 0;
      animation: fadeInBadge 0.5s ease 1s forwards;
    }
    #versionBadge span { color: #e0473c; font-weight: 600; }
    @keyframes fadeInBadge { from { opacity: 0; } to { opacity: 1; } }

    /* Build Number */
    #buildNumber {
      position: fixed;
      top: 32px;
      right: 140px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #333;
      z-index: 10001;
      opacity: 0;
      animation: fadeInBadge 0.5s ease 1s forwards;
    }

    /* Terminal Log - Bottom Left */

    /* Terminal Log */
    #terminalLog {
      position: fixed;
      bottom: 80px;
      left: 32px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: #444;
      z-index: 10001;
      opacity: 0;
      animation: fadeInBadge 0.5s ease 2s forwards;
      max-width: 260px;
    }
    .log-line { opacity: 0; margin-bottom: 3px; transition: opacity 0.3s ease; }
    .log-line.visible { opacity: 1; }
    .log-line .timestamp { color: #333; }
    .log-line .message { color: #555; }
    .log-line.success .message { color: #39FF14; }

    /* Progress bar enhancement */
    #progressBar {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, #e0473c, #ff7b6e, #e0473c);
      background-size: 200% 100%;
      animation: gradientMove 2s linear infinite;
      width: 0%;
      z-index: 10002;
      box-shadow: 0 0 15px rgba(224, 71, 60, 0.6);
      transition: width 0.1s linear;
    }
    @keyframes gradientMove { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

    /* ═══════════════════════════════════════════════════════════════════════════ */

    /* Particle field */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.6;
    }

    #introOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at center, #1a0f0d 0%, #0a0a0a 70%);
      transition: opacity 1s ease;
    }

    #brainWrapper {
      position: relative;
      width: 300px;
      height: 300px;
      transform-origin: center center;
    }

    @media (max-width: 500px) {
      #brainWrapper { width: 220px; height: 220px; }
    }

    #brainImg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 40px rgba(224, 71, 60, 0.8)) drop-shadow(0 0 80px rgba(224, 71, 60, 0.4));
      position: absolute;
      top: 0;
      left: 0;
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { filter: drop-shadow(0 0 40px rgba(224, 71, 60, 0.8)) drop-shadow(0 0 80px rgba(224, 71, 60, 0.4)); }
      50% { filter: drop-shadow(0 0 60px rgba(224, 71, 60, 1)) drop-shadow(0 0 100px rgba(224, 71, 60, 0.6)); }
    }

    #brainNodesSVG {
      position: absolute;
      top: -2px;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #introTextContainer {
      margin-top: 48px;
      text-align: center;
      z-index: 10005;
      position: relative;
    }

    #introText {
      font-size: 32px;
      color: #ff6b57;
      letter-spacing: 6px;
      text-align: center;
      white-space: nowrap;
      transition: opacity 0.3s ease;
      text-shadow: 
        0 0 10px rgba(224, 71, 60, 0.8),
        0 0 20px rgba(224, 71, 60, 0.6),
        0 0 30px rgba(224, 71, 60, 0.4),
        0 0 40px rgba(224, 71, 60, 0.2);
      font-weight: 600;
      text-transform: uppercase;
    }

    #tagline {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #9aa3ad;
      letter-spacing: 2px;
      margin-top: 12px;
      opacity: 0;
      animation: fadeIn 1s ease 2s forwards;
    }

    #dots {
      display: inline-block;
      width: 30px;
      text-align: left;
    }

    /* Progress bar */
    #progressBar {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #e0473c, #ff7b6e);
      width: 0%;
      z-index: 10001;
      box-shadow: 0 0 20px rgba(224, 71, 60, 0.6);
      transition: width 0.1s linear;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoomOut {
      from { transform: scale(1); }
      to   { transform: scale(0.9); }
    }

    @keyframes zoomIn {
      from { transform: scale(0.9); }
      to   { transform: scale(2.25); } /* Extended zoom */
    }

    .zoom-out {
      animation: zoomOut 0.5s ease forwards;
    }

    .zoom-in {
      animation: zoomIn 1.8s ease forwards;
    }

    .fade-out {
      animation: fadeOut 1.8s ease forwards;
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    /* Glitch effect on text */
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }

    .glitch {
      animation: glitch 0.3s ease;
    }
  </style>
</head>
<body>
  <canvas id="particleCanvas"></canvas>
  <canvas id="hexGrid"></canvas>
  <div id="scanlines"></div>
  <div id="progressBar"></div>
  <style>
    /* Intro tweaks */
    /* Make ACCESS GRANTED clearly green, override ID styles */
    #introText.access-granted { color: #39FF14 !important; font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 12px rgba(57,255,20,0.5), 0 0 24px rgba(57,255,20,0.25); }
    /* Lower opacity for skip button */
    #skipBtn { opacity: 0.4; transition: opacity 0.15s ease; }
    #skipBtn:hover { opacity: 0.9; }
  </style>
  
  <div id="versionBadge">NEUROFOUNDRY <span>v2.0</span></div>
  <div id="buildNumber">BUILD 2025.01</div>
  
  <button id="skipBtn">Skip Intro →</button>

  <!-- Terminal Log -->
  <div id="terminalLog">
    <div class="log-line" data-delay="1500"><span class="timestamp">[00:01]</span> <span class="message">Initializing neural core...</span></div>
    <div class="log-line" data-delay="3000"><span class="timestamp">[00:02]</span> <span class="message">Loading design systems...</span></div>
    <div class="log-line" data-delay="4500"><span class="timestamp">[00:03]</span> <span class="message">Connecting to Forge...</span></div>
    <div class="log-line" data-delay="6000"><span class="timestamp">[00:04]</span> <span class="message">Calibrating render pipeline...</span></div>
    <div class="log-line" data-delay="7500"><span class="timestamp">[00:05]</span> <span class="message">Syncing asset library...</span></div>
    <div class="log-line" data-delay="9000"><span class="timestamp">[00:06]</span> <span class="message">Runtime established...</span></div>
    <div class="log-line success" data-delay="10500"><span class="timestamp">[00:07]</span> <span class="message">Access granted ✓</span></div>
  </div>

  <div id="introOverlay">
    <div id="brainWrapper">
      <img src="brain.png" id="brainImg" alt="Neurofoundry Brain" />
      <svg id="brainNodesSVG" width="300" height="300"></svg>
    </div>
    <div id="introTextContainer">
      <div id="introText">5</div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════════
    // PARTICLE BACKGROUND
    // ═══════════════════════════════════════════════════════════════════════════
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = [];
    const particleCount = 80;

    class Particle {
      constructor() {
        this.reset();
      }
      
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.size = Math.random() * 2 + 0.5;
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      
      update() {
        this.x += this.vx;
        this.y += this.vy;
        
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(224, 71, 60, ${this.opacity})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    function drawConnections() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          if (distance < 150) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(224, 71, 60, ${0.1 * (1 - distance / 150)})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      
      drawConnections();
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ═══════════════════════════════════════════════════════════════════════════
    // HEX GRID BACKGROUND
    // ═══════════════════════════════════════════════════════════════════════════
    const hexCanvas = document.getElementById('hexGrid');
    const hexCtx = hexCanvas.getContext('2d');
    
    function resizeHexCanvas() {
      hexCanvas.width = window.innerWidth;
      hexCanvas.height = window.innerHeight;
      drawHexGrid();
    }
    
    function drawHexGrid() {
      const size = 30;
      const h = size * Math.sqrt(3);
      hexCtx.strokeStyle = 'rgba(224, 71, 60, 0.15)';
      hexCtx.lineWidth = 0.5;
      
      for (let y = -h; y < hexCanvas.height + h; y += h) {
        for (let x = -size; x < hexCanvas.width + size * 2; x += size * 3) {
          const offsetY = (Math.floor(x / (size * 3)) % 2) * (h / 2);
          drawHexagon(x, y + offsetY, size);
        }
      }
    }
    
    function drawHexagon(cx, cy, size) {
      hexCtx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI / 6;
        const x = cx + size * Math.cos(angle);
        const y = cy + size * Math.sin(angle);
        if (i === 0) hexCtx.moveTo(x, y);
        else hexCtx.lineTo(x, y);
      }
      hexCtx.closePath();
      hexCtx.stroke();
    }
    
    resizeHexCanvas();
    window.addEventListener('resize', resizeHexCanvas);

    // ═══════════════════════════════════════════════════════════════════════════
    // TERMINAL LOG ANIMATION
    // ═══════════════════════════════════════════════════════════════════════════
    document.querySelectorAll('.log-line').forEach(line => {
      const delay = parseInt(line.dataset.delay);
      setTimeout(() => {
        line.classList.add('visible');
      }, delay);
    });

    // ═══════════════════════════════════════════════════════════════════════════
    // STATUS TEXT SEQUENCE
    // ═══════════════════════════════════════════════════════════════════════════
    const introText = document.getElementById('introText');
    const dots = document.getElementById('dots');
    const progressBar = document.getElementById('progressBar');
    
    // Countdown sequence (5 → 0) at x0.65 speed
    let countdown = 5;
    introText.textContent = countdown;
    const countdownInterval = setInterval(() => {
      countdown--;
      if (countdown > 0) {
        // Normal numbers
        introText.textContent = countdown;
      } else if (countdown === 0) {
        // When 1 hits 0, turn the 0 into ACCESS GRANTED immediately
        clearInterval(countdownInterval);
        introText.textContent = 'ACCESS GRANTED';
        introText.classList.add('access-granted');
        // Bring intro text to front
        introText.style.zIndex = 10005;
        introText.style.position = 'relative';
        // Fill progress bar fully
        progressBar.style.width = '100%';
        // Transition to home shortly after access granted (allow user to see)
        setTimeout(() => initiateTransition(), 1800);
      } else {
        // safety
      }
    }, 1538);

    // ═══════════════════════════════════════════════════════════════════════════
    // BRAIN NODE TRAILS
    // ═══════════════════════════════════════════════════════════════════════════
    const svg = document.getElementById('brainNodesSVG');
    const nodeCount = 16;
    const trails = Array.from({ length: nodeCount }, () => []);
    const trailLength = 10;

    function animateNodes(t) {
      svg.innerHTML = '';

      for (let i = 0; i < nodeCount; ++i) {
        let theta = (i / nodeCount) * 2 * Math.PI + Math.sin(t * 1.2 + i) * 0.5;
        let rad = 130 + Math.sin(t * 1.8 + i * 1.7) * 35;
        let x = 190 + Math.cos(theta) * rad * 0.7 + Math.sin(t * 2.4 + i) * 18;
        let y = 190 + Math.sin(theta) * rad * 0.9 + Math.cos(t * 1.6 + i * 1.3) * 14;

        const trail = trails[i];
        trail.push({ x, y });
        if (trail.length > trailLength) trail.shift();

        // Draw trail
        for (let j = 0; j < trail.length - 1; ++j) {
          const a = trail[j];
          const b = trail[j + 1];
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", a.x);
          line.setAttribute("y1", a.y);
          line.setAttribute("x2", b.x);
          line.setAttribute("y2", b.y);
          line.setAttribute("stroke", "#ffdab9");
          line.setAttribute("stroke-width", 1.5);
          line.setAttribute("opacity", (j + 1) / trail.length * 0.8);
          line.setAttribute("stroke-linecap", "round");
          svg.appendChild(line);
        }

        // Draw node
        const node = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        node.setAttribute("cx", x);
        node.setAttribute("cy", y);
        node.setAttribute("r", 5);
        node.setAttribute("fill", "#ff7d5a");
        node.setAttribute("opacity", "0.95");
        node.setAttribute("filter", "url(#glow)");
        svg.appendChild(node);
      }

      svg.innerHTML += `
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>`;
    }

    function loop() {
      const t = performance.now() / 1000;
      animateNodes(t);
      requestAnimationFrame(loop);
    }
    loop();

    // ═══════════════════════════════════════════════════════════════════════════
    // TRANSITION TO HOME
    // ═══════════════════════════════════════════════════════════════════════════
    const overlay = document.getElementById("introOverlay");
    const brainWrapper = document.getElementById("brainWrapper");
    const introTextContainer = document.getElementById("introTextContainer");
    const skipBtn = document.getElementById("skipBtn");
    const terminalLog = document.getElementById("terminalLog");

    function initiateTransition() {
      skipBtn.style.display = 'none';
      brainWrapper.classList.add("zoom-out");
      introTextContainer.style.opacity = 0;
      if (terminalLog) terminalLog.style.opacity = 0;

      setTimeout(() => {
        brainWrapper.classList.remove("zoom-out");
        brainWrapper.classList.add("zoom-in");
        overlay.classList.add("fade-out");

        setTimeout(() => {
          window.location.href = "home.html";
        }, 1800);
      }, 500);
    }

    // Skip button
    skipBtn.addEventListener('click', () => {
      window.location.href = "home.html";
    });

    // Auto-transition fallback (in case countdown code is modified)
    setTimeout(() => initiateTransition(), 9000);
  </script>
</body>
</html>
