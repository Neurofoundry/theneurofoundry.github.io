<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architect Feed Test - Neurofoundry</title>
  <meta name="description" content="Test page for the Architect live feed visual treatment.">
  <meta name="theme-color" content="#0f1113">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1113;
      --panel: rgba(12, 14, 17, 0.75);
      --panel-border: rgba(224, 71, 60, 0.25);
      --text: #e6e9ee;
      --muted: #9aa3ad;
      --teal: rgba(0, 255, 255, 0.5);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 20% 20%, rgba(224, 71, 60, 0.08), transparent 45%),
        radial-gradient(circle at 80% 10%, rgba(255, 140, 40, 0.08), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
    }
    main.page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .panel {
      width: min(900px, 100%);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      display: grid;
      gap: 18px;
      justify-items: center;
      text-align: center;
    }
    .panel h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .panel p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    /* The Architect's Live Feed Container */
    .architect-wrap {
      position: relative;
      width: 300px;
      height: auto;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      border-radius: 14px;
    }

    .architect-img {
      width: 100%;
      display: block;
      animation: breathing 8s ease-in-out infinite;
    }

    /* The 'Scanline' Glitch Layer */
    .architect-wrap::after {
      content: " ";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 255, 255, 0.05) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.02),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.02)
      );
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }

    /* Moving data bar pulse */
    .architect-scan {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--teal);
      opacity: 0.3;
      animation: scanning 4s linear infinite;
    }

    @keyframes breathing {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.03); filter: brightness(1.1); }
    }

    @keyframes scanning {
      0% { top: 0; }
      100% { top: 100%; }
    }

    .parallax-stage {
      position: relative;
      width: 800px;
      height: 500px;
      background: #000;
      overflow: hidden;
      border: 2px solid #333;
    }

    .layer {
      position: absolute;
      background-size: cover;
      background-position: center;
      width: 130%;
      height: 130%;
      top: -15%;
      left: -15%;
      will-change: transform, filter, opacity;
    }

    .bg {
      z-index: 1;
      animation: none;
    }
    .flame-back {
      z-index: 2;
      animation: fire-sway 12s ease-in-out infinite alternate, heatwave 8s ease-in-out infinite;
      mix-blend-mode: screen;
    }
    .architect {
      z-index: 3;
      animation: architect-drift 18s ease-in-out infinite;
    }
    .robot {
      z-index: 4;
      animation: robot-sway 14s ease-in-out infinite alternate;
      filter: grayscale(0.4) contrast(1.35) brightness(0.75) saturate(0.6)
        drop-shadow(0 0 18px rgba(224, 71, 60, 0.35));
    }
    .flame-front {
      z-index: 5;
      filter: blur(10px);
      animation: fire-sway 9s ease-in-out infinite alternate, heatwave 6s ease-in-out infinite;
      mix-blend-mode: screen;
    }

    @keyframes fire-sway {
      from { transform: translateX(-14px); }
      to { transform: translateX(14px); }
    }

    @keyframes robot-sway {
      from { transform: translateX(-8px); }
      to { transform: translateX(8px); }
    }

    @keyframes architect-drift {
      0% { transform: translateX(0) scale(1); }
      50% { transform: translateX(-30px) scale(1.1); }
      100% { transform: translateX(0) scale(1); }
    }

    @keyframes heatwave {
      0%, 100% { opacity: 0.82; filter: blur(10px) brightness(1.05) contrast(1.05); }
      50% { opacity: 0.95; filter: blur(7px) brightness(1.15) contrast(1.12); }
    }

    @media (max-width: 640px) {
      .panel { padding: 24px; }
      .architect-wrap { width: 240px; }
      .parallax-stage { width: 100%; height: 320px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <h1>Architect Live Feed Test</h1>
      <p>Scanline + breathing effect, centered for quick visual review.</p>
      <div class="architect-wrap">
        <div class="architect-scan"></div>
        <img src="assets/architect_t_para.png" alt="The Architect" class="architect-img">
      </div>
      <div class="parallax-stage">
        <img src="assets/architect_para.png" class="layer bg" alt="">
        <img src="assets/flame_rear.png" class="layer flame-back" alt="">
        <img src="assets/architect_t_para.png" class="layer architect" alt="">
        <img src="assets/robot_debris.png" class="layer robot" alt="">
        <img src="assets/flame_front.png" class="layer flame-front" alt="">
      </div>
    </section>
  </main>
</body>
</html>
