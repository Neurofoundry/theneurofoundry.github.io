<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify Email | Neurofoundry</title>
  <meta name="description" content="Verify your Neurofoundry account email address.">
  <style>
    :root {
      --bg: #0f1113;
      --panel: #171a1f;
      --text: #e6e9ee;
      --muted: #a8b0bb;
      --brand: #e0473c;
      --line: rgba(224, 71, 60, 0.25);
      --ok: #4ade80;
      --bad: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 680px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
    }
    h1 {
      margin: 0 0 12px;
      color: var(--brand);
      font-size: 28px;
      line-height: 1.2;
    }
    p { margin: 10px 0; line-height: 1.6; }
    .muted { color: var(--muted); }
    .status-ok { color: var(--ok); }
    .status-bad { color: var(--bad); }
    .actions { margin-top: 18px; }
    .btn {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid rgba(224, 71, 60, 0.45);
      color: #ffd1cc;
      text-decoration: none;
      font-weight: 600;
      background: rgba(224, 71, 60, 0.12);
    }
    .btn:hover { background: rgba(224, 71, 60, 0.2); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Email Verification</h1>
    <p id="status">Verifying your email address...</p>
    <p id="details" class="muted"></p>
    <div class="actions">
      <a id="loginLink" class="btn" href="/login.html" style="display:none;">Continue to Login</a>
    </div>
  </main>

  <script>
    (async function verifyEmail() {
      const statusEl = document.getElementById('status');
      const detailsEl = document.getElementById('details');
      const loginLink = document.getElementById('loginLink');
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        statusEl.textContent = 'Verification link is missing a token.';
        statusEl.className = 'status-bad';
        detailsEl.textContent = 'Please request a new verification email from the signup flow.';
        return;
      }

      const candidates = [];
      if (window.location.protocol !== 'file:') {
        candidates.push(window.location.origin + '/api');
      }
      candidates.push('https://api.theneurofoundry.com/api');
      candidates.push('https://nf-auth-clean-20260219.fly.dev/api');

      const apiBases = [...new Set(candidates)];
      let finalError = 'Unable to reach verification service.';

      for (const apiBase of apiBases) {
        try {
          const url = apiBase + '/auth/verify-email/' + encodeURIComponent(token);
          const res = await fetch(url, {
            method: 'GET',
            headers: { Accept: 'application/json' }
          });

          const text = await res.text();
          let data = {};
          try {
            data = JSON.parse(text);
          } catch (_) {
            data = { message: text.slice(0, 140) };
          }

          if (res.ok && data.success !== false) {
            statusEl.textContent = 'Email verified successfully.';
            statusEl.className = 'status-ok';
            detailsEl.textContent = 'Your account is now verified. You can continue to login.';
            loginLink.style.display = 'inline-block';
            loginLink.href = '/login.html?verified=1';
            return;
          }

          if (res.status === 404) {
            continue;
          }

          finalError = data.message || ('Verification failed with status ' + res.status + '.');
          break;
        } catch (_) {
          finalError = 'Could not connect to the verification API.';
        }
      }

      statusEl.textContent = 'Verification failed.';
      statusEl.className = 'status-bad';
      detailsEl.textContent = finalError;
    })();
  </script>
</body>
</html>
