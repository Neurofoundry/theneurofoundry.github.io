<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Neurofoundry</title>
  <meta name="description" content="Reset your Neurofoundry account password.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="anvil.png">
  <link rel="apple-touch-icon" href="anvil.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #e0473c;
      --primary-gradient-start: #ff7b6e;
      --primary-gradient-mid: #e9584d;
      --primary-gradient-end: #b8322b;
      --primary-soft: #ffb5ad;
      --primary-border: rgba(224, 71, 60, 0.24);
      --primary-shadow: rgba(224, 71, 60, 0.18);
      --dark-bg: #090b0d;
      --surface: #12161a;
      --surface-strong: #0f1113;
      --surface-footer: #0b0d10;
      --line: #2a2f35;
      --line-soft: #20262c;
      --module-line: #2c333a;
      --dark-overlay: #0f1113;
      --light-text: #e7ebef;
      --muted-text: #9aa3ad;
      --ok: #4ade80;
      --page-max: 100%;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      padding-top: 64px;
      display: flex;
      flex-direction: column;
      background: var(--dark-bg);
      color: var(--light-text);
      font-family: Inter, sans-serif;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: linear-gradient(135deg, #1c232a 0%, var(--dark-overlay) 100%);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.42);
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      max-width: var(--page-max);
      margin: 0 auto;
      padding: 0 clamp(14px, 3vw, 24px);
      width: 100%;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--light-text);
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
      white-space: nowrap;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-gradient-start), var(--primary-color));
      color: #fff;
      font-weight: 900;
    }
    .links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: clamp(8px, 2vw, 20px);
      margin-left: auto;
    }
    .navlink {
      color: #ccc;
      font: 500 clamp(11px, 2vw, 14px)/1 Inter, sans-serif;
      text-decoration: none;
    }
    .navlink:hover { color: var(--primary-color); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border: 2px solid #a2362f;
      border-radius: 8px;
      background: linear-gradient(180deg, var(--primary-gradient-start), var(--primary-gradient-mid) 48%, var(--primary-gradient-end));
      color: #fff;
      font: 600 13px/1 Inter, sans-serif;
      text-decoration: none;
      box-shadow: 0 4px 12px var(--primary-shadow);
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(28px, 6vw, 64px) clamp(14px, 3vw, 24px);
    }
    .reset-container { width: 100%; max-width: min(420px, 100%); }
    .reset-header { text-align: center; margin-bottom: clamp(24px, 5vw, 40px); }
    .reset-header h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #d6dde5 42%, var(--primary-soft) 72%, var(--primary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .reset-header p { margin: 0; color: var(--muted-text); font-size: 14px; }
    .reset-form {
      padding: clamp(24px, 5vw, 32px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.26);
    }
    .account-email {
      display: none;
      margin-bottom: 22px;
      padding: 12px 14px;
      border: 1px solid var(--module-line);
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--light-text);
      font-size: 14px;
      word-break: break-word;
    }
    .account-email.is-visible {
      display: block;
    }
    .account-email span {
      display: block;
      margin-bottom: 6px;
      color: var(--muted-text);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      margin-bottom: 8px;
      color: #c9d0d8;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--module-line);
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--light-text);
      font: 14px/1.3 Inter, sans-serif;
    }
    input:focus {
      outline: none;
      border-color: var(--primary-color);
      background: #0b0d10;
      box-shadow: 0 0 0 2px rgba(224, 71, 60, 0.12);
    }
    .submit-btn {
      width: 100%;
      padding: 12px 18px;
      border: 2px solid #a2362f;
      border-radius: 8px;
      background: linear-gradient(180deg, var(--primary-gradient-start), var(--primary-gradient-mid) 48%, var(--primary-gradient-end));
      color: #fff;
      font: 700 14px/1 Inter, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--primary-shadow);
    }
    .submit-btn:disabled { cursor: not-allowed; opacity: 0.72; }
    .status {
      min-height: 20px;
      margin-top: 16px;
      color: var(--muted-text);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--primary-color); }
    .reset-request {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--line-soft);
    }
    .reset-request.is-open {
      display: block;
    }
    footer {
      padding: 32px 18px;
      background: var(--surface-footer);
      border-top: 1px solid var(--line-soft);
      color: var(--muted-text);
      font-size: 12px;
      text-align: center;
    }
    footer a { color: var(--muted-text); text-decoration: none; }
    footer a:hover { color: var(--primary-color); }
    @media (max-width: 760px) {
      .brand span { display: none; }
      .navlink:nth-of-type(n+3) { display: none; }
      .btn { padding: 6px 12px; font-size: 11px; }
    }
    @media (max-width: 640px) {
      body { padding-top: 58px; }
      .nav { height: 58px; padding: 0 14px; }
      main { padding: 24px 14px; }
    }
  </style>
  <link rel="stylesheet" href="main-preview-edit/common/site-header.css">
  <link rel="stylesheet" href="main-preview-edit/common/site-footer.css">
</head>
<body>
  <div data-site-header></div>
  <script src="main-preview-edit/common/site-header.js"></script>

  <main>
    <div class="reset-container">
      <div class="reset-header">
        <h1 id="heading">Reset Password</h1>
        <p id="intro">Set a new password for your Neurofoundry account.</p>
      </div>

      <form class="reset-form" id="resetForm">
        <div class="account-email" id="accountBox">
          <span>Account Email</span>
          <strong id="accountEmail"></strong>
        </div>

        <div class="form-group">
          <label for="password">New Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required>
        </div>

        <button id="submitButton" class="submit-btn" type="submit">SUBMIT</button>
        <div id="status" class="status"></div>

        <div class="reset-request" id="resetRequest">
          <div class="form-group">
            <label for="requestEmail">Email</label>
            <input id="requestEmail" name="requestEmail" type="email" placeholder="user@example.com" autocomplete="email">
          </div>
          <button id="requestButton" class="submit-btn" type="button">SEND RESET LINK</button>
        </div>
      </form>
    </div>
  </main>
  <div data-site-footer></div>
  <script src="main-preview-edit/common/site-footer.js"></script>

  <script>
    (function setupPasswordReset() {
      const apiBase = 'https://api.theneurofoundry.com/api';
      const token = new URLSearchParams(window.location.search).get('token');
      const form = document.getElementById('resetForm');
      const accountBox = document.getElementById('accountBox');
      const accountEmail = document.getElementById('accountEmail');
      const heading = document.getElementById('heading');
      const intro = document.getElementById('intro');
      const status = document.getElementById('status');
      const submitButton = document.getElementById('submitButton');
      const resetRequest = document.getElementById('resetRequest');
      const requestEmail = document.getElementById('requestEmail');
      const requestButton = document.getElementById('requestButton');

      function setStatus(message, type) {
        status.textContent = message || '';
        status.className = `status${type ? ` ${type}` : ''}`;
      }

      function disableForm() {
        document.getElementById('password').disabled = true;
        document.getElementById('confirmPassword').disabled = true;
        submitButton.disabled = true;
      }

      function showResetRequest() {
        resetRequest.classList.add('is-open');
        requestEmail.required = true;
      }

      function passwordMeetsRules(password) {
        return password.length >= 10
          && /[A-Z]/.test(password)
          && /[0-9]/.test(password)
          && /[^A-Za-z0-9]/.test(password);
      }

      function startLoginRedirect() {
        let remaining = 10;
        setStatus(`Password updated. Redirecting... (${remaining})`, 'ok');
        const timer = setInterval(() => {
          remaining -= 1;
          setStatus(`Password updated. Redirecting... (${remaining})`, 'ok');
          if (remaining <= 0) {
            clearInterval(timer);
            window.location.href = '/login.html?reset=1';
          }
        }, 1000);
      }

      async function loadResetDetails() {
        if (!token) {
          heading.textContent = 'Reset Link Failed';
          intro.textContent = 'Neurofoundry could not verify this reset link.';
          setStatus('Enter your email below to request a new reset link.', 'bad');
          disableForm();
          showResetRequest();
          return;
        }

        try {
          const res = await fetch(`${apiBase}/auth/reset-password/${encodeURIComponent(token)}`, {
            headers: { Accept: 'application/json' }
          });

          if (!res.ok) throw new Error(await res.text());

          const payload = await res.json();
          accountEmail.textContent = payload.data.user.email;
          accountBox.classList.add('is-visible');
          setStatus('');
        } catch (error) {
          console.warn('Reset lookup failed:', error);
          heading.textContent = 'Reset Link Failed';
          intro.textContent = 'Neurofoundry could not verify this reset link.';
          setStatus('Enter your email below to request a new reset link.', 'bad');
          disableForm();
          showResetRequest();
        }
      }

      requestButton.addEventListener('click', async () => {
        const email = requestEmail.value.trim();
        if (!email) {
          setStatus('Enter your email to request a new reset link.', 'bad');
          return;
        }

        requestButton.disabled = true;
        requestButton.textContent = 'SENDING...';

        try {
          await fetch(`${apiBase}/auth/forgot-password`, {
            method: 'POST',
            headers: {
              Accept: 'application/json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email })
          });

          setStatus('Request Sent! Please check your email for instructions.', 'ok');
        } catch (error) {
          console.warn('Reset request failed:', error);
          setStatus('Request Sent! Please check your email for instructions.', 'ok');
        } finally {
          requestButton.disabled = false;
          requestButton.textContent = 'SEND RESET LINK';
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!passwordMeetsRules(password)) {
          setStatus('Password must be at least 10 characters with one capital letter, one number, and one special character.', 'bad');
          return;
        }

        if (password !== confirmPassword) {
          setStatus('Passwords do not match.', 'bad');
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'SUBMITTING...';
        setStatus('');

        try {
          const res = await fetch(`${apiBase}/auth/reset-password`, {
            method: 'POST',
            headers: {
              Accept: 'application/json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ token, password })
          });

          if (!res.ok) throw new Error(await res.text());

          document.getElementById('password').value = '';
          document.getElementById('confirmPassword').value = '';
          disableForm();
          startLoginRedirect();
        } catch (error) {
          console.warn('Password reset failed:', error);
          submitButton.disabled = false;
          submitButton.textContent = 'SUBMIT';
          setStatus('Neurofoundry could not reset your password. Please wait a moment, then try again.', 'bad');
        }
      });

      loadResetDetails();
    })();
  </script>
</body>
</html>
