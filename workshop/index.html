  <style>
    :root {
      --bg-0: #080909;
      --bg-1: #0e0f0f;
      --bg-2: #101111;
      --bg-3: #161919;
      --fg-0: #ffffff;
      --fg-1: #e6e7e7;
      --fg-2: #bcbbbc;
      --fg-3: #8a8a8b;
      --fg-4: #5a5c5c;
      --line-1: #1f2222;
      --line-2: #2a2e2e;
      --accent: #e0473c;
      --accent-hi: #ff9b93;
      --accent-tint: rgba(224, 71, 60, 0.12);
      --accent-border: rgba(224, 71, 60, 0.34);
      --font-display: "Michroma", "Eurostile", "Bahnschrift", system-ui, sans-serif;
      --font-sans: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --page-max: 1264px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scrollbar-gutter: stable;
    }

    html,
    body {
      min-height: 100%;
      background: var(--bg-2);
      color: var(--fg-1);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 20px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      overflow-x: hidden;
      padding-top: 58px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent 72%);
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
    }

    .workshop-warning-cover {
      position: fixed;
      inset: 58px 0 0;
      width: 100%;
      height: calc(100vh - 58px);
      object-fit: cover;
      z-index: 50;
      pointer-events: none;
      user-select: none;
    }

    .workshop-soon-window {
      position: fixed;
      top: calc(58px + 50%);
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 60;
      width: min(420px, calc(100vw - 32px));
      padding: 24px 28px;
      border: 1px solid rgba(224, 71, 60, 0.42);
      border-radius: 8px;
      background: rgba(10, 12, 14, 0.88);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.48);
      color: var(--fg-0);
      text-align: center;
      font-size: clamp(24px, 5vw, 38px);
      font-weight: 800;
      line-height: 1.1;
    }

    .workshop-hero {
      position: relative;
      overflow: hidden;
      background: var(--bg-1);
      border-bottom: 1px solid var(--line-1);
      padding: clamp(34px, 6vw, 58px) clamp(14px, 3vw, 32px) clamp(38px, 6vw, 56px);
      min-height: 250px;
      display: flex;
      align-items: center;
    }

    .hero-inner {
      width: min(var(--page-max), 100%);
      margin: 0 auto;
      position: relative;
      display: grid;
      gap: 16px;
    }

    .hero-hex-grid {
      position: absolute;
      right: max(-24px, calc((100vw - var(--page-max)) / -2));
      top: 0;
      opacity: 0.35;
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 40px;
      width: max-content;
      padding: 0 13px 0 11px;
      border: 1px solid var(--accent-border);
      border-radius: 8px;
      background: rgba(10, 12, 14, 0.72);
      color: var(--accent-hi);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      text-decoration: none;
      text-transform: none;
    }

    .eyebrow:hover {
      border-color: var(--accent);
      color: var(--fg-0);
    }

    .eyebrow span {
      font-size: 19px;
      line-height: 1;
    }

    .workshop-hero h1 {
      max-width: 720px;
      color: var(--fg-0);
      font-size: clamp(32px, 6vw, 62px);
      font-weight: 800;
      letter-spacing: -0.015em;
      line-height: 0.98;
    }

    .workshop-hero p {
      max-width: 560px;
      color: var(--fg-3);
      font-size: 15px;
      line-height: 24px;
    }

    .workshop-section {
      width: min(var(--page-max), 100%);
      margin: 0 auto;
      padding: 28px clamp(14px, 3vw, 32px) 60px;
    }

    .section-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .section-title {
      color: var(--fg-0);
      font-size: 13px;
      font-weight: 700;
    }

    .section-count {
      color: var(--fg-4);
      font-size: 12px;
    }

    .workshop-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .workshop-card {
      min-height: 178px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px;
      border: 1px solid var(--line-1);
      border-radius: 10px;
      background: var(--bg-1);
      transition: border-color 180ms, background 180ms;
    }

    .workshop-card:hover {
      border-color: var(--line-2);
      background: var(--bg-3);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .hex-icon {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
    }

    .card-meta {
      flex: 1;
      min-width: 0;
    }

    .card-name {
      color: var(--fg-0);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
    }

    .card-version {
      margin-top: 2px;
      color: var(--fg-4);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .badge {
      flex-shrink: 0;
      display: inline-block;
      margin-top: 2px;
      padding: 2px 7px;
      border-radius: 3px;
      color: var(--fg-4);
      background: rgba(90, 92, 92, 0.1);
      border: 1px solid rgba(90, 92, 92, 0.18);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 16px;
      text-transform: uppercase;
    }

    .card-desc {
      color: var(--fg-3);
      font-size: 12px;
      line-height: 18px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      padding-top: 4px;
    }

    .card-platform {
      color: var(--fg-4);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .card-spacer {
      flex: 1;
    }

    .card-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 30px;
      padding: 6px 14px;
      border: 1px solid var(--line-2);
      border-radius: 6px;
      background: var(--bg-0);
      color: var(--fg-4);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      opacity: 0.72;
      pointer-events: none;
      white-space: nowrap;
    }

    @media (max-width: 860px) {
      body {
        padding-top: 50px;
      }

      .workshop-warning-cover {
        inset: 50px 0 0;
        height: calc(100vh - 50px);
      }

      .workshop-soon-window {
        top: calc(50px + 50%);
      }

      .workshop-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 540px) {
      .workshop-grid {
        grid-template-columns: 1fr;
      }

      .workshop-hero {
        padding-top: 30px;
      }

      .workshop-section {
        padding-bottom: 44px;
      }
    }
  </style>
</head>
