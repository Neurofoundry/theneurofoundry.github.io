    body { background: #0f1113; color: #e6e9ee; margin: 0; font-family: Inter, sans-serif; }

    .dropdown-toggle {
      background: none;
      border: none;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #ccc;
      font: 500 14px/1 Inter, sans-serif;
      transition: color 0.2s;
    }
    .dropdown-toggle:hover,
    .dropdown-toggle:focus-visible {
      color: #e0473c;
      outline: none;
    }
    .dropdown-caret {
      font-size: 11px;
      opacity: 0.7;
    }
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 200px;
      background: rgba(15, 17, 19, 0.96);
      border: 1px solid rgba(224, 71, 60, 0.25);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 50;
    }
    .dropdown::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      height: 10px;
    }
    .dropdown-menu a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      color: #c9d0d8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }
    .dropdown-menu a:hover {
      background: rgba(224, 71, 60, 0.18);
      color: #fff;
    }
    .dropdown:hover .dropdown-menu,
    .dropdown:focus-within .dropdown-menu {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 18px;
      border-radius: 8px;

      text-decoration: none;

    }
    .btn.secondary {

    }

      padding: 24px 0px;

    .work-grid {

      padding: 0 40px;

      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(15, 17, 19, 0.85), rgba(10, 11, 13, 0.95));

      transition: all 0.3s;
      cursor: pointer;

      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 30px rgba(224, 71, 60, 0.25);
      border-color: #e0473c;
      z-index: 10;
    }

      width: 100%;

      object-fit: cover;

      transition: transform 0.3s, filter 0.3s;
    }

      z-index: 1;

      transform: scale(1.05); 
      filter: blur(2px);
    }

      opacity: 1;

<body>
  <!-- Neural Particles Background -->
  <canvas id="neural-particles" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.4;"></canvas>
  

  <main>
    
    <div class="section-divider"></div>
    
    <section class="bottom-section">

  <script>
    function createEmber() {
      const divider = document.querySelector('.section-divider');
      if (!divider) return;
      const startX = Math.random() * window.innerWidth;
      const rect = divider.getBoundingClientRect();
      const scrollY = window.scrollY || window.pageYOffset;
      const startY = rect.top + scrollY;
      const ember = document.createElement('span');
      ember.className = 'ember';
      ember.style.left = startX + 'px';
      ember.style.top = startY + 'px';
      const riseDistance = 220 + Math.random() * 140;
      const drift = (Math.random() - 0.5) * 140;
      const duration = (1600 + Math.random() * 1200) * 0.9;
      const size = 3 + Math.random() * 4;
      ember.style.width = size + 'px';
      ember.style.height = size + 'px';
      ember.style.transition = `transform ${duration}ms ease-out, opacity ${duration}ms ease-out`;
      document.body.appendChild(ember);
      requestAnimationFrame(() => {
        ember.style.transform = `translate(${drift}px, -${riseDistance}px)`;
        ember.style.opacity = '0';
      });
      setTimeout(() => ember.remove(), duration + 30);
    }
    function scheduleEmbers() {
      createEmber();
      const nextDelay = (65 + Math.random() * 100) * 0.8;  // 20% more embers
      setTimeout(scheduleEmbers, nextDelay);
    }
    window.addEventListener('load', scheduleEmbers);
    function createSpark() {
      const startX = window.innerWidth - 60;
      const startY = window.innerHeight - 60;
      const spark = document.createElement('span');
      spark.className = 'spark';
      spark.style.left = startX + 'px';
      spark.style.top = startY + 'px';
      const angleVariation = (Math.random() - 0.5) * 60;
      const distance = 40 + Math.random() * 80;
      const radians = (angleVariation - 90) * (Math.PI / 180);
      const driftX = Math.cos(radians) * distance;
      const driftY = Math.sin(radians) * distance;
      const duration = 800 + Math.random() * 600;
      const rotation = (Math.random() - 0.5) * 720;
      spark.style.transition = `transform ${duration}ms ease-out, opacity ${duration}ms ease-out`;
      document.body.appendChild(spark);
      requestAnimationFrame(() => {
        spark.style.transform = `translate(${driftX}px, ${driftY}px) rotate(${rotation}deg)`;
        spark.style.opacity = '0';
      });
      setTimeout(() => spark.remove(), duration + 50);
    }
    function scheduleSparks() {
      if (Math.random() < 0.7) {
        createSpark();
      }
      const nextDelay = 100 + Math.random() * 200;
      setTimeout(scheduleSparks, nextDelay);
    }
    window.addEventListener('load', scheduleSparks);
    function handleSubmit() {
      alert('Form submission would be handled here. Connect to your backend or email service.');
    }
  </script>
  <script>
    window.addEventListener('load', () => {
      function makeDraggableResizable(el, container) {
        el.style.position = 'absolute';
        el.style.cursor = 'move';
        let mode = null;
        let startX = 0;
        let startY = 0;
        let startLeft = 0;
        let startTop = 0;
        let startWidth = 0;
        let startHeight = 0;

        function startInteraction(e, nextMode) {
          const bounds = container.getBoundingClientRect();
          const rect = el.getBoundingClientRect();
          mode = nextMode;
          startX = e.clientX;
          startY = e.clientY;
          startLeft = rect.left - bounds.left;
          startTop = rect.top - bounds.top;
          startWidth = rect.width;
          startHeight = rect.height;
          el.setPointerCapture(e.pointerId);
          document.body.style.userSelect = 'none';
        }

        function onPointerDown(e) {
          if (e.button !== 0) return;
          const isResizeHandle = e.target.classList.contains('floating-resize-handle');
          const isEditableTarget = e.target.isContentEditable;
          setActiveItem(el);
          if (isEditableTarget && !isResizeHandle) {
            e.stopPropagation();
            return;
          }
          e.preventDefault();
          startInteraction(e, isResizeHandle ? 'resize' : 'drag');
          e.stopPropagation();
        }

        function onPointerMove(e) {
          if (!mode) return;
          const bounds = container.getBoundingClientRect();
          if (mode === 'drag') {
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            const left = clamp(startLeft + dx, 0, bounds.width - startWidth);
            const top = clamp(startTop + dy, 0, bounds.height - startHeight);
            el.style.left = px(left);
            el.style.top = px(top);
          } else {
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            const minSize = 60;
            const maxWidth = bounds.width - startLeft;
            const maxHeight = bounds.height - startTop;
            const width = clamp(startWidth + dx, minSize, maxWidth);
            const height = clamp(startHeight + dy, minSize, maxHeight);
            el.style.width = px(width);
            el.style.height = px(height);
          }
        }

        function endInteraction(e) {
          if (!mode) return;
          mode = null;
          document.body.style.userSelect = '';
          if (el.hasPointerCapture(e.pointerId)) {
            el.releasePointerCapture(e.pointerId);
          }
        }

        el.addEventListener('pointerdown', onPointerDown);
        el.addEventListener('pointermove', onPointerMove);
        el.addEventListener('pointerup', endInteraction);
        el.addEventListener('pointercancel', endInteraction);
      }

      function setupBoxTools(box) {
        const lockBtn = box.querySelector('.lock-btn');
        const tagInput = box.querySelector('.tag-input');
        if (!lockBtn || !tagInput) return;
        lockBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const locked = box.classList.toggle('locked');
          lockBtn.textContent = locked ? '🔓' : '🔒';
          box.style.cursor = locked ? 'default' : 'move';
          box.querySelector('.resize-handle').style.display = locked ? 'none' : '';
        });
        tagInput.addEventListener('input', (e) => {
          box.setAttribute('data-tag', tagInput.value);
        });
      }

      const addBtn = document.getElementById('addBoxBtn');
      const removeBtn = document.getElementById('removeBoxBtn');
      const saveBtn = document.getElementById('saveLayoutBtn');
      const addImageBtn = document.getElementById('addImageBtn');
      const addTextBtn = document.getElementById('addTextBtn');
      const addButtonBtn = document.getElementById('addButtonBtn');
      const layerUpBtn = document.getElementById('layerUpBtn');
      const layerDownBtn = document.getElementById('layerDownBtn');
      const savePageBtn = document.getElementById('savePageBtn');
      const loadPageBtn = document.getElementById('loadPageBtn');
      const saveSnapshotBtn = document.getElementById('saveSnapshotBtn');
      const loadSnapshotBtn = document.getElementById('loadSnapshotBtn');
      const insertImageInput = document.getElementById('insertImageInput');
      const snapshotInput = document.getElementById('snapshotInput');
      const pageInput = document.getElementById('pageInput');
      const boxLayer = document.getElementById('boxLayer');
      const layoutInner = document.getElementById('layoutInner');
      const customLayer = document.getElementById('customLayer');
      const layoutStage = document.getElementById('layoutStage');
      const contentLayer = document.getElementById('contentLayer');
      const output = document.getElementById('layoutOutput');
      const boxCount = document.getElementById('boxCount');
      const backdropInput = document.getElementById('backdropInput');
      const clearBackdropBtn = document.getElementById('clearBackdropBtn');
      if (!addBtn || !removeBtn || !saveBtn || !addImageBtn || !addTextBtn || !addButtonBtn || !layerUpBtn || !layerDownBtn || !savePageBtn || !loadPageBtn || !saveSnapshotBtn || !loadSnapshotBtn || !insertImageInput || !snapshotInput || !pageInput || !boxLayer || !layoutInner || !customLayer || !layoutStage || !contentLayer || !output || !boxCount || !backdropInput || !clearBackdropBtn) {
        return;
      }

      const state = {
        activeBox: null,
        activeItem: null,
        drag: null,
        offsetIndex: 0,
        customZ: 5
      };
      let backdropUrl = '';

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function px(value) {
        return Math.round(value) + 'px';
      }

      function metricsFor(box) {
        const left = parseFloat(box.style.left) || 0;
        const top = parseFloat(box.style.top) || 0;
        const width = parseFloat(box.style.width) || box.offsetWidth;
        const height = parseFloat(box.style.height) || box.offsetHeight;
        return {
          left: Math.round(left),
          top: Math.round(top),
          width: Math.round(width),
          height: Math.round(height)
        };
      }

      function updateLabel(box) {
        const label = box.querySelector('.box-label');
        if (!label) return;
        const metrics = metricsFor(box);
        label.textContent = `x:${metrics.left} y:${metrics.top} w:${metrics.width} h:${metrics.height}`;
      }

      function updateCount() {
        boxCount.textContent = `Boxes: ${boxLayer.children.length}`;
      }

      function setBackdrop(url) {
        if (backdropUrl) {
          URL.revokeObjectURL(backdropUrl);
        }
        backdropUrl = url || '';
        if (backdropUrl) {
          contentLayer.style.setProperty('--backdrop', `url("${backdropUrl}")`);
          clearBackdropBtn.disabled = false;
        } else {
          contentLayer.style.setProperty('--backdrop', 'none');
          clearBackdropBtn.disabled = true;
        }
      }

      function selectBox(box) {
        if (state.activeBox) {
          state.activeBox.classList.remove('selected');
        }
        state.activeBox = box;
        if (state.activeBox) {
          state.activeBox.classList.add('selected');
          clearActiveItem();
        }
        removeBtn.disabled = !state.activeBox;
      }

      function clearActiveItem() {
        if (state.activeItem) {
          state.activeItem.classList.remove('selected');
        }
        state.activeItem = null;
        layerUpBtn.disabled = true;
        layerDownBtn.disabled = true;
      }

      function setActiveItem(item) {
        if (state.activeItem) {
          state.activeItem.classList.remove('selected');
        }
        state.activeItem = item;
        if (state.activeItem) {
          state.activeItem.classList.add('selected');
          selectBox(null);
          layerUpBtn.disabled = false;
          layerDownBtn.disabled = false;
        } else {
          layerUpBtn.disabled = true;
          layerDownBtn.disabled = true;
        }
      }

      function getItemZ(item) {
        return parseInt(item.dataset.z || item.style.zIndex || '1', 10);
      }

      function setItemZ(item, value) {
        const next = clamp(value, 1, 50);
        item.dataset.z = String(next);
        item.style.zIndex = String(next);
        if (next > state.customZ) {
          state.customZ = next;
        }
      }

      function bumpActiveItemZ(delta) {
        if (!state.activeItem) return;
        const current = getItemZ(state.activeItem);
        setItemZ(state.activeItem, current + delta);
      }

      function createFloatingItem(contentEl, options) {
        const wrapper = document.createElement('div');
        wrapper.className = 'floating-item';
        wrapper.style.left = px(options.left);
        wrapper.style.top = px(options.top);
        wrapper.style.width = px(options.width);
        wrapper.style.height = px(options.height);
        setItemZ(wrapper, state.customZ + 1);
        contentEl.classList.add('floating-content');
        wrapper.appendChild(contentEl);
        const handle = document.createElement('div');
        handle.className = 'floating-resize-handle';
        wrapper.appendChild(handle);
        makeDraggableResizable(wrapper, layoutInner);
        return wrapper;
      }

      function buildBoxElement(data) {
        const box = document.createElement('div');
        box.className = 'layout-box' + (data.locked ? ' locked' : '');
        box.style.left = px(data.left);

        wrapper.appendChild(content);
        const handle = document.createElement('div');
        handle.className = 'floating-resize-handle';
        wrapper.appendChild(handle);
        makeDraggableResizable(wrapper, layoutInner);
        return wrapper;
      }

      function addBox() {

        const height = 120;
        const offset = 12 + state.offsetIndex * 18;
        const left = clamp(offset, 0, innerRect.width - width);
        const top = clamp(offset, 0, innerRect.height - height);
        const box = document.createElement('div');
        box.className = 'layout-box';
        box.style.left = px(left);
        box.style.top = px(top);
        box.style.width = px(width);
        box.style.height = px(height);
        box.innerHTML = `
  <div class="box-label"></div>

      function removeBox() {
        if (!state.activeBox) return;

        updateCount();
      }

      function startMove(e, box) {
        const rect = box.getBoundingClientRect();
        const innerRect = layoutInner.getBoundingClientRect();
        state.drag = {
          mode: 'move',
          box,
          startX: e.clientX,
          startY: e.clientY,
          startLeft: rect.left - innerRect.left,
          startTop: rect.top - innerRect.top,
          width: rect.width,
          height: rect.height
        };
      }

      function startResize(e, box) {
        const rect = box.getBoundingClientRect();
        const innerRect = layoutInner.getBoundingClientRect();
        state.drag = {
          mode: 'resize',
          box,
          startX: e.clientX,
          startY: e.clientY,
          startLeft: rect.left - innerRect.left,
          startTop: rect.top - innerRect.top,
          startWidth: rect.width,
          startHeight: rect.height
        };
      }

      function onPointerDown(e) {
        const box = e.target.closest('.layout-box');
        if (!box) {
          selectBox(null);
          clearActiveItem();
          return;
        }
        e.preventDefault();
        selectBox(box);
        if (box.classList.contains('locked')) return;
        if (e.target.classList.contains('resize-handle')) {
          startResize(e, box);
        } else if (!e.target.classList.contains('lock-btn') && !e.target.classList.contains('tag-input')) {
          startMove(e, box);
        }
      }

      function onPointerMove(e) {
        if (!state.drag) return;
        const innerRect = layoutInner.getBoundingClientRect();
        if (state.drag.mode === 'move') {
          const dx = e.clientX - state.drag.startX;
          const dy = e.clientY - state.drag.startY;
          const left = clamp(state.drag.startLeft + dx, 0, innerRect.width - state.drag.width);
          const top = clamp(state.drag.startTop + dy, 0, innerRect.height - state.drag.height);
          state.drag.box.style.left = px(left);
          state.drag.box.style.top = px(top);
        } else {
          const dx = e.clientX - state.drag.startX;
          const dy = e.clientY - state.drag.startY;
          const minSize = 40;
          const maxWidth = innerRect.width - state.drag.startLeft;
          const maxHeight = innerRect.height - state.drag.startTop;
          const width = clamp(state.drag.startWidth + dx, minSize, maxWidth);
          const height = clamp(state.drag.startHeight + dy, minSize, maxHeight);
          state.drag.box.style.width = px(width);
          state.drag.box.style.height = px(height);
        }
        updateLabel(state.drag.box);
      }

      function onPointerUp() {
        state.drag = null;
      }

      function saveLayout() {
        const boxes = Array.from(boxLayer.querySelectorAll('.layout-box'));
        const floatingItems = Array.from(customLayer.querySelectorAll('.floating-item'));
        const boxLines = boxes.map((box) => {
          const metrics = metricsFor(box);
          const tag = box.getAttribute('data-tag') || '';
          const locked = box.classList.contains('locked');
          return `      <div class=\"layout-box${locked ? ' locked' : ''}\" style=\"left:${metrics.left}px; top:${metrics.top}px; width:${metrics.width}px; height:${metrics.height}px;\" data-tag=\"${tag}\"></div>`;
        });
        const floatingLines = floatingItems.map((item) => {
          const metrics = metricsFor(item);
          const zIndex = item.dataset.z || item.style.zIndex || '1';
          const content = item.querySelector('.floating-content');
          if (!content) return '';
          const clone = content.cloneNode(true);
          clone.removeAttribute('contenteditable');
          const html = clone.outerHTML;
          return `      <div class=\"floating-item\" style=\"left:${metrics.left}px; top:${metrics.top}px; width:${metrics.width}px; height:${metrics.height}px; z-index:${zIndex};\">${html}</div>`;
        }).filter(Boolean);
        const backdrop = contentLayer.style.getPropertyValue('--backdrop');
        const backdropStyle = backdrop ? ` style=\"--backdrop:${backdrop};\"` : '';
        const htmlLines = [
          '<section class=\"layout-export\">',
          '  <div class=\"layout-stage\">',
          '    <div class=\"layout-inner\">',
          `      <div class=\"content-layer\"${backdropStyle}></div>`,
          '      <div class=\"layout-layer\">',
          ...boxLines,
          '      </div>',
          '      <div class=\"custom-layer\">',
          ...floatingLines,
          '      </div>',
          '    </div>',
          '  </div>',
          '</section>'
        ];
        const cssLines = [
          `.layout-stage { position: relative; width: 100%; height: ${Math.round(layoutInner.clientHeight)}px; }`,
          '.layout-inner { position: relative; width: 100%; height: 100%; }',
          '.content-layer { position: absolute; inset: 0; }',
          '.layout-layer { position: absolute; inset: 0; }',
          '.custom-layer { position: absolute; inset: 0; }',
          '.layout-box { position: absolute; }',

          '.floating-content { width: 100%; height: 100%; display: block; box-sizing: border-box; }'
        ];
        output.value = htmlLines.join('\n') + '\n\n<style>\n' + cssLines.join('\n') + '\n</style>';

      function savePage() {
        const main = document.querySelector('main');
        if (!main) return;
        const canvas = document.getElementById('neural-particles');
        const mainClone = main.cloneNode(true);
        const stage = mainClone.querySelector('.layout-stage');
        mainClone.querySelectorAll('.builder-toolbar, .layout-output').forEach((el) => el.remove());
        if (stage) {
          stage.querySelectorAll('.box-label, .box-tools, .resize-handle, .floating-resize-handle, .content-placeholder').forEach((el) => el.remove());
          stage.querySelectorAll('.layout-box').forEach((box) => box.classList.remove('selected'));
          stage.querySelectorAll('.floating-item').forEach((item) => item.classList.remove('selected'));
          stage.querySelectorAll('[contenteditable]').forEach((el) => el.removeAttribute('contenteditable'));
        }
        const bodyParts = [];
        if (canvas) {
          bodyParts.push(canvas.outerHTML);
        }
        bodyParts.push(mainClone.outerHTML);
        const snapshotJson = JSON.stringify(serializeSnapshot()).replace(/</g, '\\u003c');
        bodyParts.push('<script id="nf-snapshot" type="application/json">' + snapshotJson + '</' + 'script>');
        const html = [
          '<!doctype html>',
          '<html>',
          '<head>',
          document.head.innerHTML,
          '</head>',
          '<body>',
          bodyParts.join('\n'),
          '</body>',
          '</html>'
        ].join('\n');
        const blob = new Blob([html], { type: 'text/html' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `layout-export-${Date.now()}.html`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }

      function loadPageFromHtml(htmlText) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const snapshotScript = doc.querySelector('#nf-snapshot');
        if (!snapshotScript || !snapshotScript.textContent) {
          return false;
        }
        try {
          const data = JSON.parse(snapshotScript.textContent);
          applySnapshot(data);
          return true;
        } catch (err) {
          console.error('Invalid embedded snapshot', err);
          return false;
        }
      }

      function readPrefabsFromStorage() {
        try {
          return JSON.parse(localStorage.getItem('nf_builder_prefabs')) || [];
        } catch {
          return [];
        }
      }

      function serializeSnapshot() {
        const boxes = Array.from(boxLayer.querySelectorAll('.layout-box')).map((box) => {
          const metrics = metricsFor(box);
          return {
            left: metrics.left,
            top: metrics.top,
            width: metrics.width,
            height: metrics.height,
            tag: box.getAttribute('data-tag') || '',
            locked: box.classList.contains('locked')
          };
        });
        const items = Array.from(customLayer.querySelectorAll('.floating-item')).map((item) => {
          const metrics = metricsFor(item);
          const content = item.querySelector('.floating-content');
          return {
            left: metrics.left,
            top: metrics.top,
            width: metrics.width,
            height: metrics.height,
            z: parseInt(item.dataset.z || item.style.zIndex || '5', 10),
            html: content ? content.outerHTML : ''
          };
        });
        return {
          version: 1,
          layoutStageHeight: Math.round(layoutStage.clientHeight),
          backdrop: contentLayer.style.getPropertyValue('--backdrop') || '',
          prefabs: readPrefabsFromStorage(),
          boxes,
          items
        };
      }

      function saveSnapshot() {
        const data = serializeSnapshot();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `layout-snapshot-${Date.now()}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }

      function clearLayout() {
        boxLayer.innerHTML = '';
        customLayer.innerHTML = '';
        selectBox(null);
        clearActiveItem();
        updateCount();
      }

      function applySnapshot(data) {
        if (!data || typeof data !== 'object') return;
        clearLayout();
        if (typeof data.layoutStageHeight === 'number') {
          layoutStage.style.height = px(data.layoutStageHeight);
        }
        if (data.backdrop) {
          contentLayer.style.setProperty('--backdrop', data.backdrop);
          clearBackdropBtn.disabled = false;
        } else {
          contentLayer.style.setProperty('--backdrop', 'none');
          clearBackdropBtn.disabled = true;
        }
        (data.boxes || []).forEach((boxData) => {
          const box = buildBoxElement(boxData);
          boxLayer.appendChild(box);
        });
        (data.items || []).forEach((itemData) => {
          const item = buildFloatingElement(itemData);
          customLayer.appendChild(item);
        });
        if (Array.isArray(data.prefabs)) {
          try {
            localStorage.setItem('nf_builder_prefabs', JSON.stringify(data.prefabs));
          } catch {}
        }
        updateCount();
      }

    prefabBar.style = 'margin:12px 0;display:flex;gap:8px;align-items:center;';
    prefabBar.innerHTML = '<span style="font-size:13px;color:#ff7840;">Prefabs:</span>' +
      Array.from({length:10},(_,i)=>`<button class="builder-btn prefab-save" data-i="${i}">Save ${i+1}</button><button class="builder-btn prefab-load" data-i="${i}">Load ${i+1}</button>`).join('');
    document.querySelector('.builder-toolbar').appendChild(prefabBar);
    prefabBar.querySelectorAll('.prefab-save').forEach(btn=>btn.onclick=e=>savePrefab(+btn.dataset.i));
    prefabBar.querySelectorAll('.prefab-load').forEach(btn=>btn.onclick=e=>loadPrefab(+btn.dataset.i));
    // End prefab tools
    });
  </script>

</body>
