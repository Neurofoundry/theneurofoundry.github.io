<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auth Callback – Neurofoundry</title>
  <script src="/auth-client.js?v=20260219b"></script>
  <style>
    body {
      background: #0f1113;
      color: #e6e9ee;
      font-family: Inter, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .loading {
      text-align: center;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(224, 71, 60, 0.3);
      border-top-color: #e0473c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <p>Completing authentication...</p>
  </div>

  <script>
    // Handle OAuth callback
    (async () => {
      try {
        const auth = new window.NeurofoundryAuth({
          apiUrl: 'https://api.theneurofoundry.com/api'
        });
        await auth.handleOAuthCallback();
      } catch (error) {
        console.error('OAuth callback error:', error);
        // Show error and redirect
        document.querySelector('.loading p').textContent = 'Authentication failed. Redirecting...';
        setTimeout(() => {
          window.location.href = '/login.html?error=' + encodeURIComponent(error.message);
        }, 2000);
      }
    })();
  </script>
</body>
</html>
