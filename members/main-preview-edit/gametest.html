<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Synapse Recall</title>
    <style>
        body {
            background-color: #0f172a;
            color: #38bdf8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 1000px;
            margin: 0;
        }

        #game-container {
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 120px);
            gap: 20px;
            margin-top: 30px;
        }

        .node {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.6;
        }

        .node:active { transform: scale(0.95); }

        /* Synapse Colors */
        #red { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }
        #blue { background-color: #3b82f6; box-shadow: 0 0 10px #3b82f6; }
        #green { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        #yellow { background-color: #eab308; box-shadow: 0 0 10px #eab308; }

        .active {
            opacity: 1 !important;
            transform: scale(1.1);
            filter: brightness(1.5);
            box-shadow: 0 0 30px white !important;
        }

        button {
            padding: 10px 25px;
            font-size: 1.2rem;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* Canvas background & stacking */
        #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: block; }
        #game-container { position: relative; z-index: 2; }
        .nf-spark { position: absolute; pointer-events: none; width: 8px; height: 8px; border-radius: 50%; mix-blend-mode: screen; }
    </style>
</head>
<body>

    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <div id="game-container">
        <h1>SYNAPSE RECALL</h1>
        <h2 id="status">Press Start to Begin</h2>
        
        <div class="grid">
            <div class="node" id="red" onclick="handleInput('red')"></div>
            <div class="node" id="blue" onclick="handleInput('blue')"></div>
            <div class="node" id="green" onclick="handleInput('green')"></div>
            <div class="node" id="yellow" onclick="handleInput('yellow')"></div>
        </div>

        <button id="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <script>
        let gameSequence = [];
        let playerSequence = [];
        let level = 0;
        const colors = ['red', 'blue', 'green', 'yellow'];

        function startGame() {
            gameSequence = [];
            level = 0;
            nextRound();
            document.getElementById('start-btn').style.display = 'none';
        }

        function nextRound() {
            playerSequence = [];
            level++;
            document.getElementById('status').innerText = `Level ${level}`;
            
            // Add a new random color to the sequence
            const randomColor = colors[Math.floor(Math.random() * 4)];
            gameSequence.push(randomColor);
            
            playSequence();
        }

        async function playSequence() {
            // Disable clicks while showing sequence
            document.querySelector('.grid').style.pointerEvents = 'none';
            
            for (const color of gameSequence) {
                await flashNode(color);
                await new Promise(resolve => setTimeout(resolve, 300));
            }
            
            document.querySelector('.grid').style.pointerEvents = 'all';
        }

        function flashNode(color) {
            return new Promise(resolve => {
                const node = document.getElementById(color);
                if (!node) return resolve();
                node.classList.add('active');
                // spawn canvas particle burst for visual feedback
                if (typeof spawnParticleBurstAt === 'function') spawnParticleBurstAt(node, color);
                setTimeout(() => {
                    node.classList.remove('active');
                    resolve();
                }, 600);
            });
        }

        function handleInput(color) {
            playerSequence.push(color);
            const index = playerSequence.length - 1;

            if (playerSequence[index] !== gameSequence[index]) {
                gameOver();
                return;
            }

            if (playerSequence.length === gameSequence.length) {
                setTimeout(nextRound, 1000);
            }
        }

        function gameOver() {
            document.getElementById('status').innerText = `Synapse Misfire! Final Score: ${level - 1}`;
            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('start-btn').innerText = 'Retry';
            gameSequence = [];
        }
    </script>

    <script>
    (function(){
      const canvas = document.getElementById('bg-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let DPR = window.devicePixelRatio || 1;
      function fit(){
        canvas.width = Math.round(canvas.clientWidth * DPR);
        canvas.height = Math.round(canvas.clientHeight * DPR);
        ctx.setTransform(DPR,0,0,DPR,0,0);
      }
      window.addEventListener('resize', fit);
      fit();

      const particles = [];
      const MAX = 350;
      const colorMap = { red: 'rgba(224,71,60,0.95)', blue: 'rgba(59,130,246,0.95)', green: 'rgba(34,197,94,0.95)', yellow: 'rgba(234,179,8,0.95)'};

      function spawnAt(x,y,c,n){
        n = n || (6 + Math.floor(Math.random()*10));
        for (let i=0;i<n;i++){
          if (particles.length >= MAX) break;
          const angle = Math.random()*Math.PI*2;
          const speed = 40 + Math.random()*220;
          particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, r: 3 + Math.random()*8, life: 0, ttl: 420 + Math.random()*780, color: colorMap[c] || 'rgba(255,255,255,0.9)' });
        }
      }

      window.spawnParticleBurstAt = function(node, color){
        const rect = node.getBoundingClientRect();
        const x = rect.left + rect.width/2;
        const y = rect.top + rect.height/2;
        spawnAt(x,y,color, 10 + Math.floor(Math.random()*8));
      };

      // ambient particles
      setInterval(()=>{
        spawnAt(Math.random()*window.innerWidth, Math.random()*window.innerHeight, ['blue','yellow','red','green'][Math.floor(Math.random()*4)], Math.floor(Math.random()*3)+1);
      }, 700);

      let last = performance.now();
      function frame(now){
        const dt = now - last; last = now;
        ctx.clearRect(0,0,canvas.width/DPR, canvas.height/DPR);
        ctx.globalCompositeOperation = 'lighter';
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life += dt;
          if (p.life >= p.ttl) { particles.splice(i,1); continue; }
          const t = p.life / p.ttl;
          p.x += p.vx * (dt/1000);
          p.y += p.vy * (dt/1000);
          const alpha = 1 - t;
          ctx.beginPath();
          ctx.fillStyle = p.color;
          ctx.globalAlpha = alpha * 0.95;
          ctx.arc(p.x, p.y, p.r * (1 - t*0.5), 0, Math.PI*2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
