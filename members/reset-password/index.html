<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Neurofoundry</title>
  <meta name="description" content="Reset your Neurofoundry account password.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="../../anvil.png">
  <link rel="apple-touch-icon" href="../../anvil.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #e0473c;
      --primary-gradient-start: #ff7b6e;
      --primary-gradient-mid: #e9584d;
      --primary-gradient-end: #b8322b;
      --primary-soft: #ffb5ad;
      --primary-border: rgba(224, 71, 60, 0.24);
      --primary-shadow: rgba(224, 71, 60, 0.18);
      --dark-bg: #090b0d;
      --surface: #12161a;
      --surface-strong: #0f1113;
      --surface-footer: #0b0d10;
      --line: #2a2f35;
      --line-soft: #20262c;
      --module-line: #2c333a;
      --dark-overlay: #0f1113;
      --light-text: #e7ebef;
      --muted-text: #9aa3ad;
      --ok: #4ade80;
      --page-max: 100%;
    }
    *, *::before, *::after { box-sizing: border-box; }
    .reset-container { width: 100%; max-width: min(420px, 100%); margin: 0 auto; }
    .account-email {
      display: none;
      margin-bottom: 22px;
      padding: 12px 14px;
      border: 1px solid var(--module-line);
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--light-text);
      font-size: 14px;
      word-break: break-word;
    }
    .account-email.is-visible {
      display: block;
    }
    .account-email span {
      display: block;
      margin-bottom: 6px;
      color: var(--muted-text);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      margin-bottom: 8px;
      color: #c9d0d8;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--module-line);
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--light-text);
      font: 14px/1.3 Inter, sans-serif;
    }
    input:focus {
      outline: none;
      border-color: var(--primary-color);
      background: #0b0d10;
      box-shadow: 0 0 0 2px rgba(224, 71, 60, 0.12);
    }
    .submit-btn {
      width: 100%;
      padding: 12px 18px;
      border: 2px solid #a2362f;
      border-radius: 8px;
      background: linear-gradient(180deg, var(--primary-gradient-start), var(--primary-gradient-mid) 48%, var(--primary-gradient-end));
      color: #fff;
      font: 700 14px/1 Inter, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--primary-shadow);
    }
    .submit-btn:disabled { cursor: not-allowed; opacity: 0.72; }
    .status {
      min-height: 20px;
      margin-top: 16px;
      color: var(--muted-text);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--primary-color); }
    .reset-request {
      display: none;
    }
    .reset-request.is-open {
      display: block;
    }
  </style>
  <link rel="stylesheet" href="../../common/site-header.css?v=20260519b">
  <link rel="stylesheet" href="../../common/site-footer.css">
  <link rel="stylesheet" href="../../common/account-shell.css">
</head>
<body class="nf-account-page">
  <div data-site-header></div>
  <script src="../../common/site-header.js?v=20260603-mobile-logout" data-base="../../"></script>
  <canvas id="neural-particles" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.46;"></canvas>

  <main class="nf-account-main">
    <div class="reset-container nf-account-shell">
      <div class="reset-header nf-account-heading">
        <h1 id="heading">Reset Password</h1>
        <p id="intro">Please verify your information</p>
      </div>

      <form class="reset-form nf-account-card" id="resetForm">
        <div class="account-email" id="accountBox">
          <span>Account Email</span>
          <strong id="accountEmail"></strong>
        </div>

        <div class="form-group">
          <label for="password">New Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required>
        </div>

        <button id="submitButton" class="submit-btn" type="submit">SUBMIT</button>
        <div id="status" class="status"></div>
      </form>

      <div class="reset-request nf-account-card" id="resetRequest">
        <div class="form-group">
          <label for="requestEmail">Email</label>
          <input id="requestEmail" name="requestEmail" type="email" placeholder="user@example.com" autocomplete="email">
        </div>
        <button id="requestButton" class="submit-btn" type="button">SEND RESET LINK</button>
      </div>
    </div>
  </main>
  <div data-site-footer></div>
  <script src="../../common/site-footer.js?v=20260519-footer" data-base="../../"></script>
  <script src="../../shared/neural-particles.js"></script>

  <script>
    (function setupPasswordReset() {
      function resolveDefaultApiUrl() {
        const hostname = window.location.hostname || '';
        const protocol = window.location.protocol || '';

        if (protocol === 'file:' || hostname === 'localhost' || hostname === '127.0.0.1') {
          return 'http://localhost:3000/api';
        }

        if (hostname.endsWith('theneurofoundry.com')) {
          return 'https://api.theneurofoundry.com/api';
        }

        return `${window.location.origin}/api`;
      }

      const apiBase = resolveDefaultApiUrl();
      const token = new URLSearchParams(window.location.search).get('token');
      const form = document.getElementById('resetForm');
      const accountBox = document.getElementById('accountBox');
      const accountEmail = document.getElementById('accountEmail');
      const heading = document.getElementById('heading');
      const intro = document.getElementById('intro');
      const status = document.getElementById('status');
      const submitButton = document.getElementById('submitButton');
      const resetRequest = document.getElementById('resetRequest');
      const requestEmail = document.getElementById('requestEmail');
      const requestButton = document.getElementById('requestButton');

      function setStatus(message, type) {
        status.textContent = message || '';
        status.className = `status${type ? ` ${type}` : ''}`;
      }

      function disableForm() {
        document.getElementById('password').disabled = true;
        document.getElementById('confirmPassword').disabled = true;
        submitButton.disabled = true;
      }

      function showResetRequest() {
        resetRequest.classList.add('is-open');
        requestEmail.required = true;
      }

      function passwordMeetsRules(password) {
        return password.length >= 10
          && /[A-Z]/.test(password)
          && /[0-9]/.test(password)
          && /[^A-Za-z0-9]/.test(password);
      }

      function startLoginRedirect() {
        let remaining = 10;
        setStatus(`Password updated. Redirecting... (${remaining})`, 'ok');
        const timer = setInterval(() => {
          remaining -= 1;
          setStatus(`Password updated. Redirecting... (${remaining})`, 'ok');
          if (remaining <= 0) {
            clearInterval(timer);
            window.location.href = '/members/login/?reset=1';
          }
        }, 1000);
      }

      async function loadResetDetails() {
        if (!token) {
          heading.textContent = 'Reset Link Failed';
          intro.textContent = 'Neurofoundry could not verify this reset link';
          setStatus('Enter your email below to request a new reset link.', 'bad');
          disableForm();
          showResetRequest();
          return;
        }

        try {
          const res = await fetch(`${apiBase}/auth/reset-password/${encodeURIComponent(token)}`, {
            headers: { Accept: 'application/json' }
          });

          if (!res.ok) throw new Error(await res.text());

          const payload = await res.json();
          accountEmail.textContent = payload.data.user.email;
          accountBox.classList.add('is-visible');
          setStatus('');
        } catch (error) {
          console.warn('Reset lookup failed:', error);
          heading.textContent = 'Reset Link Failed';
          intro.textContent = 'Neurofoundry could not verify this reset link';
          setStatus('Enter your email below to request a new reset link.', 'bad');
          disableForm();
          showResetRequest();
        }
      }

      requestButton.addEventListener('click', async () => {
        const email = requestEmail.value.trim();
        if (!email) {
          setStatus('Enter your email to request a new reset link.', 'bad');
          return;
        }

        requestButton.disabled = true;
        requestButton.textContent = 'SENDING...';

        try {
          await fetch(`${apiBase}/auth/forgot-password`, {
            method: 'POST',
            headers: {
              Accept: 'application/json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email })
          });

          setStatus('Request Sent! Please check your email for instructions.', 'ok');
        } catch (error) {
          console.warn('Reset request failed:', error);
          setStatus('Request Sent! Please check your email for instructions.', 'ok');
        } finally {
          requestButton.disabled = false;
          requestButton.textContent = 'SEND RESET LINK';
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!passwordMeetsRules(password)) {
          setStatus('Password must be at least 10 characters with one capital letter, one number, and one special character.', 'bad');
          return;
        }

        if (password !== confirmPassword) {
          setStatus('Passwords do not match.', 'bad');
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'SUBMITTING...';
        setStatus('');

        try {
          const res = await fetch(`${apiBase}/auth/reset-password`, {
            method: 'POST',
            headers: {
              Accept: 'application/json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ token, password })
          });

          if (!res.ok) throw new Error(await res.text());

          document.getElementById('password').value = '';
          document.getElementById('confirmPassword').value = '';
          disableForm();
          startLoginRedirect();
        } catch (error) {
          console.warn('Password reset failed:', error);
          submitButton.disabled = false;
          submitButton.textContent = 'SUBMIT';
          setStatus('Neurofoundry could not reset your password. Please wait a moment, then try again.', 'bad');
        }
      });

      loadResetDetails();
    })();
  </script>
</body>
</html>
