<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify Email | Neurofoundry</title>
  <meta name="description" content="Verify your Neurofoundry account email address.">
  <script src="/auth-client.js?v=20260421"></script>
  <style>
    :root {
      --bg: #0f1113;
      --panel: #171a1f;
      --text: #e6e9ee;
      --muted: #a8b0bb;
      --brand: #e0473c;
      --line: rgba(224, 71, 60, 0.25);
      --ok: #4ade80;
      --bad: #e0473c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 680px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      color: var(--brand);
      font-size: 28px;
      line-height: 1.2;
    }
    p { margin: 10px 0; line-height: 1.6; }
    .muted { color: var(--muted); }
    .status-ok { color: var(--ok); }
    .status-bad { color: var(--bad); }
    .countdown {
      color: var(--muted);
      font-size: 15px;
    }
    .actions { margin-top: 18px; }
    .btn {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid rgba(224, 71, 60, 0.45);
      color: #ffd1cc;
      text-decoration: none;
      font-weight: 600;
      background: rgba(224, 71, 60, 0.12);
    }
    .btn:hover { background: rgba(224, 71, 60, 0.2); }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="heading">Email Verification</h1>
    <p id="status">Verifying your email address...</p>
    <p id="details" class="muted"></p>
    <p id="redirect" class="countdown" style="display:none;"></p>
    <div class="actions">
      <a id="loginLink" class="btn" href="/members/login/" style="display:none;">Continue to Login</a>
    </div>
  </main>

  <script>
    (async function verifyEmail() {
      const headingEl = document.getElementById('heading');
      const statusEl = document.getElementById('status');
      const detailsEl = document.getElementById('details');
      const redirectEl = document.getElementById('redirect');
      const loginLink = document.getElementById('loginLink');
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const loginUrl = '/members/login/?verified=1';

      function startLoginRedirect() {
        let remaining = 10;
        redirectEl.style.display = 'block';
        redirectEl.textContent = `Redirecting... (${remaining})`;

        const timer = setInterval(() => {
          remaining -= 1;
          redirectEl.textContent = `Redirecting... (${remaining})`;

          if (remaining <= 0) {
            clearInterval(timer);
            window.location.href = loginUrl;
          }
        }, 1000);
      }

      if (!token) {
        headingEl.textContent = 'Verification Failed';
        headingEl.className = 'status-bad';
        statusEl.textContent = 'Neurofoundry could not verify your email address.';
        detailsEl.textContent = 'Please wait a moment, then try your request again.';
        return;
      }

      const apiBase = window.NeurofoundryAuth.resolveDefaultApiUrl();
      let finalError = 'Unable to reach verification service.';

      try {
        const url = apiBase + '/auth/verify-email/' + encodeURIComponent(token);
        const res = await fetch(url, {
          method: 'GET',
          headers: { Accept: 'application/json' }
        });

        const text = await res.text();
        let data = {};
        try {
          data = JSON.parse(text);
        } catch (_) {
          data = { message: text.slice(0, 140) };
        }

        if (res.ok && data.success !== false) {
          headingEl.textContent = 'Email Verification: Success';
          headingEl.className = 'status-ok';
          statusEl.textContent = 'Your account is verified.';
          detailsEl.textContent = '';
          loginLink.href = loginUrl;
          startLoginRedirect();
          return;
        }

        finalError = data.message || ('Verification failed with status ' + res.status + '.');
      } catch (_) {
        finalError = 'Could not connect to the verification API.';
      }

      headingEl.textContent = 'Verification Failed';
      headingEl.className = 'status-bad';
      statusEl.textContent = 'Neurofoundry could not verify your email address.';
      console.warn('Email verification failed:', finalError);
      detailsEl.textContent = 'Please wait a moment, then try your request again.';
    })();
  </script>
</body>
</html>
