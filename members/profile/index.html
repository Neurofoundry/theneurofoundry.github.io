<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | Neurofoundry</title>
  <meta name="description" content="Manage your Neurofoundry profile and account settings">
  <meta name="theme-color" content="#0f1113">
  <link rel="icon" type="image/png" href="../../anvil.png">
  <link rel="apple-touch-icon" href="../../anvil.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="/auth-client.js?v=20260219b"></script>
  <style>
    :root {
      --primary-color: #e0473c;
      --primary-gradient-start: #ff7b6e;
      --primary-gradient-mid: #e9584d;
      --primary-gradient-end: #b8322b;
      --primary-soft: #ffb5ad;
      --primary-shadow: rgba(224, 71, 60, 0.18);
      --dark-bg: #090b0d;
      --surface: #12161a;
      --surface-strong: #0f1113;
      --line: #2a2f35;
      --line-soft: #20262c;
      --module-line: #2c333a;
      --light-text: #e7ebef;
      --muted-text: #9aa3ad;
      --ok: #4ade80;
    }

    *, *::before, *::after { box-sizing: border-box; }

    .avatar-row {
      display: grid;
      gap: 10px;
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line-soft);
    }

    .avatar-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: 100%;
      max-width: 100%;
      min-height: 88px;
    }

    .avatar,
    .avatar-choice {
      width: 76px;
      height: 76px;
      position: relative;
      border: 2px solid var(--primary-color);
      border-radius: 50%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--primary-color);
      font-size: 34px;
      font-weight: 800;
      flex: 0 0 auto;
      cursor: pointer;
    }

    .avatar {
      border-width: 3px;
      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.52),
        0 0 0 2px rgba(255, 115, 104, 0.18),
        inset 0 1px 2px rgba(255, 255, 255, 0.24),
        inset 0 -5px 12px rgba(0, 0, 0, 0.5);
    }

    .avatar img,
    .avatar-choice img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-choice-tray {
      display: flex;
      margin-left: auto;
      flex: 0 0 auto;
    }

    .avatar-choice {
      transition: border-color 180ms ease, box-shadow 180ms ease;
      font-size: 17px;
      color: var(--muted-text);
      background: #050607;
    }

    .avatar-choice:hover,
    .avatar-choice:focus {
      border-color: var(--primary-soft);
      box-shadow: 0 0 18px rgba(224, 71, 60, 0.16);
      outline: none;
    }

    .avatar-choice.is-unavailable {
      opacity: 0.42;
      cursor: default;
    }

    .avatar-choice svg {
      width: 28px;
      height: 28px;
      display: block;
      stroke: currentColor;
    }

    .custom-avatar-choice {
      display: grid;
      place-items: center;
    }

    .avatar-picker input {
      display: none;
    }

    .avatar-actions {
      max-width: 100%;
    }

    .avatar-actions p,
    .field-note {
      margin: 0;
      color: var(--muted-text);
      font-size: 12px;
      line-height: 1.45;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 16px;
    }

    .form-group.full,
    .preferences-field,
    .toggle-row,
    .profile-meta {
      grid-column: 1 / -1;
    }

    label.field-label,
    .preferences-heading {
      display: block;
      margin-bottom: 8px;
      color: #c9d0d8;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .preferences-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--module-line);
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--light-text);
      font: 14px/1.3 Inter, sans-serif;
    }

    input[type="text"]:focus,
    input[type="email"]:focus {
      outline: none;
      border-color: var(--primary-color);
      background: #0b0d10;
      box-shadow: 0 0 0 2px rgba(224, 71, 60, 0.12);
    }

    input[readonly] {
      color: var(--muted-text);
      cursor: not-allowed;
    }

    input[readonly].muted-field {
      background: rgba(18, 22, 26, 0.72);
      color: #9ba3ad;
    }

    .toggle-row {
      padding: 16px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: var(--surface-strong);
    }

    .toggle-control {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--light-text);
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
    }

    .toggle-control input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary-color);
      flex: 0 0 auto;
    }

    .profile-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      color: var(--muted-text);
      font-size: 13px;
    }

    .profile-meta span {
      min-width: 0;
    }

    .profile-meta strong {
      display: block;
      margin-top: 4px;
      color: var(--light-text);
      font-size: 14px;
      font-weight: 700;
    }

    .verification-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border: 1px solid rgba(74, 222, 128, 0.3);
      border-radius: 999px;
      background: rgba(74, 222, 128, 0.1);
      color: var(--ok);
      font-size: 12px;
      white-space: nowrap;
    }

    .verification-badge.unverified-badge {
      border-color: rgba(255, 165, 0, 0.3);
      background: rgba(255, 165, 0, 0.1);
      color: #ffa500;
    }

    .profile-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--line-soft);
    }

    .btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border: 2px solid transparent;
      border-radius: 8px;
      font: 700 13px/1 Inter, sans-serif;
      cursor: pointer;
      text-decoration: none;
    }

    .btn.primary {
      border-color: #a2362f;
      background: linear-gradient(180deg, var(--primary-gradient-start), var(--primary-gradient-mid) 48%, var(--primary-gradient-end));
      color: #fff;
      box-shadow: 0 4px 12px var(--primary-shadow);
    }

    .btn.secondary {
      border-color: var(--module-line);
      background: var(--surface-strong);
      color: var(--light-text);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.72;
    }

    #message {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    #message.success {
      border: 1px solid rgba(74, 222, 128, 0.3);
      background: rgba(74, 222, 128, 0.1);
      color: var(--ok);
    }

    #message.error {
      border: 1px solid rgba(224, 71, 60, 0.3);
      background: rgba(224, 71, 60, 0.1);
      color: var(--primary-soft);
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .avatar-picker,
      .avatar-actions {
        max-width: 100%;
      }
      .avatar,
      .avatar-choice {
        width: 82px;
        height: 82px;
      }
      .profile-actions {
        align-items: stretch;
        flex-direction: column;
      }
      .profile-meta { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="../../common/site-header.css">
  <link rel="stylesheet" href="../../common/site-footer.css">
  <link rel="stylesheet" href="../../common/account-shell.css">
</head>
<body class="nf-account-page">
  <div data-site-header></div>
  <script src="../../common/site-header.js" data-base="../../"></script>
  <canvas id="neural-particles" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.46;"></canvas>

  <main class="nf-account-main">
    <div class="nf-account-shell">
      <div class="nf-account-heading">
        <h1>Profile</h1>
        <p>Manage your account details</p>
      </div>

      <div id="message"></div>

      <form id="profileForm" class="nf-account-card">
        <div class="avatar-row">
          <div class="avatar-picker" id="avatarPicker">
            <button class="avatar" id="avatarToggle" type="button" aria-label="Current profile picture">
              <span id="avatarInitial">U</span>
              <img id="avatarImg" alt="" style="display: none;">
            </button>
            <div class="avatar-choice-tray" aria-label="Avatar choices">
              <button class="avatar-choice custom-avatar-choice" id="customAvatarButton" type="button" aria-label="Upload custom avatar">
                <img src="/assets/profile-avatars/av_upload.png" alt="" loading="lazy">
              </button>
            </div>
            <input type="file" id="avatarInput" accept="image/*">
          </div>
          <div class="avatar-actions">
            <p>PNG, JPG, GIF, or WEBP. Max 5MB.</p>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="field-label" for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" autocomplete="given-name">
          </div>

          <div class="form-group">
            <label class="field-label" for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" autocomplete="family-name">
          </div>

          <div class="form-group full">
            <label class="field-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="muted-field" readonly>
          </div>

          <div class="form-group full">
            <label class="field-label" for="location">Location</label>
            <input type="text" id="location" name="location" class="muted-field" autocomplete="address-level2" placeholder="Unavailable" readonly>
          </div>

          <div class="preferences-field">
            <div class="preferences-heading">
              <span>Email Preferences</span>
              <span id="verificationBadge"></span>
            </div>
            <div class="toggle-row">
              <label class="toggle-control" for="marketingOptOut">
                <input type="checkbox" id="marketingOptOut" name="marketingOptOut">
                Opt out of Marketing Emails
              </label>
            </div>
          </div>

          <div class="profile-meta">
            <span>Member Since:<strong id="memberSince">Loading...</strong></span>
            <span>Last Login:<strong id="lastLogin">Loading...</strong></span>
            <span>Plan:<strong id="planStatus">Loading...</strong></span>
          </div>
        </div>

        <div class="profile-actions">
          <button type="submit" class="btn primary" id="saveProfileButton">Save Profile</button>
          <button type="button" class="btn secondary" onclick="handleLogout()">Logout</button>
        </div>
      </form>
    </div>
  </main>

  <div data-site-footer></div>
  <script src="../../common/site-footer.js" data-base="../../"></script>
  <script src="../../shared/neural-particles.js"></script>

  <script>
    window.nfAuth = new window.NeurofoundryAuth({
      apiUrl: window.NeurofoundryAuth.resolveDefaultApiUrl()
    });

    if (!window.nfAuth.isAuthenticated()) {
      window.location.href = '/members/login/?redirect=' + encodeURIComponent(window.location.pathname);
    }

    let currentPreferences = {};

    function profileImageSrc(avatar) {
      if (!avatar) return '';
      if (/^https?:\/\//i.test(avatar)) return avatar;
      if (avatar.startsWith('/assets/')) return avatar;
      if (avatar.startsWith('/api/')) {
        const apiOrigin = new URL(window.nfAuth.apiUrl).origin;
        return `${apiOrigin}${avatar}`;
      }
      const apiOrigin = new URL(window.nfAuth.apiUrl).origin;
      return `${apiOrigin}${avatar}`;
    }

    function resizeAvatarFile(file) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        const objectUrl = URL.createObjectURL(file);

        image.onload = () => {
          URL.revokeObjectURL(objectUrl);
          const size = 256;
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          const sourceSize = Math.min(image.naturalWidth, image.naturalHeight);
          const sourceX = Math.max(0, (image.naturalWidth - sourceSize) / 2);
          const sourceY = Math.max(0, (image.naturalHeight - sourceSize) / 2);

          canvas.width = size;
          canvas.height = size;
          context.drawImage(image, sourceX, sourceY, sourceSize, sourceSize, 0, 0, size, size);
          canvas.toBlob((blob) => {
            if (!blob) {
              reject(new Error('Could not process profile picture.'));
              return;
            }
            resolve(new File([blob], 'avatar.webp', { type: 'image/webp' }));
          }, 'image/webp', 0.78);
        };

        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('Could not read profile picture.'));
        };

        image.src = objectUrl;
      });
    }

    function formatPlan(user) {
      return String(user.planTier || 'free').toLowerCase() === 'free' ? 'Free Tier' : 'Paid Tier';
    }

    function formatMemberSince(value) {
      const date = value ? new Date(value) : null;
      if (!date || Number.isNaN(date.valueOf())) return 'Unknown';
      const day = date.getDate();
      const suffix = day % 10 === 1 && day !== 11 ? 'st'
        : day % 10 === 2 && day !== 12 ? 'nd'
          : day % 10 === 3 && day !== 13 ? 'rd'
            : 'th';
      const month = date.toLocaleDateString('en-US', { month: 'long' });
      return `${month} ${day}${suffix}, ${date.getFullYear()}`;
    }

    function formatLocation(value) {
      const location = String(value || '').trim();
      if (!location) return 'Unavailable';
      if (/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(location)) return 'Unavailable';
      return location;
    }

    function isOAuthUser(user) {
      const authProvider = String(user.authProvider || 'local').toLowerCase();
      return authProvider && authProvider !== 'local';
    }

    function setIdentityFieldsLocked(locked) {
      ['firstName', 'lastName'].forEach((fieldId) => {
        const field = document.getElementById(fieldId);
        field.readOnly = locked;
        field.classList.toggle('muted-field', locked);
      });
      document.getElementById('profileForm').dataset.identityLocked = locked ? 'true' : 'false';
    }

    function locationForSave() {
      const location = document.getElementById('location').value.trim();
      return location === 'Unavailable' ? '' : location;
    }

    async function loadProfile() {
      try {
        const response = await window.nfAuth.apiRequest('/profile');
        const user = response.data.profile;
        window.nfAuth.saveAuthState({
          ...window.nfAuth.getCurrentUser(),
          ...user
        }, window.nfAuth.token);
        const preferences = user.preferences || {};
        currentPreferences = {
          howHeardAboutNeurofoundry: '',
          ...preferences
        };
        const avatarImg = document.getElementById('avatarImg');
        const avatarInitial = document.getElementById('avatarInitial');
        const firstName = user.firstName || '';

        if (user.avatar) {
          avatarImg.onerror = () => {
            avatarImg.style.display = 'none';
            avatarInitial.style.display = 'block';
            avatarInitial.textContent = (firstName || 'N')[0].toUpperCase();
          };
          avatarImg.src = profileImageSrc(user.avatar);
          avatarImg.style.display = 'block';
          avatarInitial.style.display = 'none';
        } else {
          avatarImg.style.display = 'none';
          avatarInitial.style.display = 'block';
          avatarInitial.textContent = (firstName || 'N')[0].toUpperCase();
        }

        document.getElementById('memberSince').textContent = formatMemberSince(user.createdAt);
        document.getElementById('planStatus').textContent = formatPlan(user);
        document.getElementById('lastLogin').textContent = formatMemberSince(user.lastLoginAt);

        document.getElementById('verificationBadge').innerHTML = user.emailVerified
          ? '<span class="verification-badge">Email Verified</span>'
          : '<span class="verification-badge unverified-badge">Email Not Verified</span>';

        document.getElementById('firstName').value = user.firstName || '';
        document.getElementById('lastName').value = user.lastName || '';
        setIdentityFieldsLocked(isOAuthUser(user));
        document.getElementById('email').value = user.email || '';
        document.getElementById('email').dataset.currentEmail = user.email || '';
        document.getElementById('location').value = formatLocation(user.location);
        document.getElementById('marketingOptOut').checked = !!preferences.marketingOptOut;
      } catch (error) {
        console.error('Error loading profile:', error);
        showMessage('Failed to load profile.', 'error');
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const saveButton = document.getElementById('saveProfileButton');
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();

      saveButton.disabled = true;
      saveButton.textContent = 'Saving...';

      try {
        if (document.getElementById('profileForm').dataset.identityLocked !== 'true') {
          await window.nfAuth.updateProfile({
            firstName,
            lastName,
            name: `${firstName} ${lastName}`.trim()
          });
        }

        await window.nfAuth.apiRequest('/user/preferences', {
          method: 'PATCH',
          body: JSON.stringify({
            preferences: {
              ...currentPreferences,
              howHeardAboutNeurofoundry: currentPreferences.howHeardAboutNeurofoundry || '',
              location: locationForSave(),
              marketingOptOut: document.getElementById('marketingOptOut').checked
            }
          })
        });

        showMessage('Profile saved.', 'success');
        loadProfile();
      } catch (error) {
        showMessage(error.message || 'Failed to save profile.', 'error');
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = 'Save Profile';
      }
    });

    document.querySelectorAll('.preset-avatar').forEach((button) => {
      const image = button.querySelector('img');
      image.addEventListener('error', () => {
        image.style.display = 'none';
        button.classList.add('is-unavailable');
        button.disabled = true;
      });

      image.addEventListener('load', () => {
        const fallback = button.querySelector('span');
        if (fallback) fallback.style.display = 'none';
      });

      button.addEventListener('click', async () => {
        if (button.disabled) return;

        try {
          await window.nfAuth.apiRequest('/profile/avatar/preset', {
            method: 'PATCH',
            body: JSON.stringify({
              avatar: button.dataset.avatarSrc
            })
          });
          showMessage('Profile picture saved.', 'success');
          loadProfile();
        } catch (error) {
          showMessage(error.message || 'Failed to update profile picture.', 'error');
        }
      });
    });

    document.getElementById('customAvatarButton').addEventListener('click', () => {
      document.getElementById('avatarInput').click();
    });

    document.getElementById('avatarInput').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        showMessage('File size must be less than 5MB.', 'error');
        return;
      }

      try {
        const resizedFile = await resizeAvatarFile(file);
        await window.nfAuth.uploadAvatar(resizedFile);
        showMessage('Profile picture saved.', 'success');
        loadProfile();
      } catch (error) {
        showMessage(error.message || 'Failed to upload profile picture.', 'error');
      } finally {
        event.target.value = '';
      }
    });

    async function handleLogout() {
      if (confirm('Are you sure you want to logout?')) {
        await window.nfAuth.logout();
        window.location.href = '/home.html';
      }
    }

    function showMessage(text, type) {
      const message = document.getElementById('message');
      message.textContent = text;
      message.className = type;
      message.style.display = 'block';
      setTimeout(() => {
        message.style.display = 'none';
      }, 5000);
    }

    loadProfile();
  </script>
</body>
</html>
