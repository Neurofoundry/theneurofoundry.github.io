<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | Neurofoundry</title>
  <meta name="description" content="Manage your Neurofoundry profile and account settings">
  <meta name="theme-color" content="#0f1113">
  <link rel="icon" type="image/png" href="../../anvil.png">
  <link rel="apple-touch-icon" href="../../anvil.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="/auth-client.js?v=20260219b"></script>
  <style>
    :root {
      --primary-color: #e0473c;
      --primary-gradient-start: #ff7b6e;
      --primary-gradient-mid: #e9584d;
      --primary-gradient-end: #b8322b;
      --primary-soft: #ffb5ad;
      --primary-shadow: rgba(224, 71, 60, 0.18);
      --dark-bg: #090b0d;
      --surface: #12161a;
      --surface-strong: #0f1113;
      --line: #2a2f35;
      --line-soft: #20262c;
      --module-line: #2c333a;
      --light-text: #e7ebef;
      --muted-text: #9aa3ad;
      --ok: #4ade80;
    }

    *, *::before, *::after { box-sizing: border-box; }

    .avatar-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line-soft);
    }

    .avatar {
      width: 88px;
      height: 88px;
      position: relative;
      border: 2px solid var(--primary-color);
      border-radius: 50%;
      background: var(--surface-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--primary-color);
      font-size: 34px;
      font-weight: 800;
      flex: 0 0 auto;
      cursor: pointer;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar input {
      display: none;
    }

    .avatar-upload-icon {
      width: 34px;
      height: 34px;
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      color: rgba(246, 177, 122, 0.92);
      font-size: 18px;
      line-height: 1;
      z-index: 3;
    }

    .avatar-upload-icon svg {
      width: 24px;
      height: 24px;
      display: block;
      stroke: currentColor;
    }

    .avatar:hover .avatar-upload-icon {
      color: var(--primary-soft);
    }

    .avatar-actions {
      display: grid;
      gap: 8px;
    }

    .avatar-actions p,
    .field-note {
      margin: 0;
      color: var(--muted-text);
      font-size: 12px;
      line-height: 1.45;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 16px;
    }

    .form-group.full,
    .toggle-row,
    .profile-meta {
      grid-column: 1 / -1;
    }

    label.field-label,
    .toggle-row span {
      display: block;
      margin-bottom: 8px;
      color: #c9d0d8;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--module-line);
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--light-text);
      font: 14px/1.3 Inter, sans-serif;
    }

    input[type="text"]:focus,
    input[type="email"]:focus {
      outline: none;
      border-color: var(--primary-color);
      background: #0b0d10;
      box-shadow: 0 0 0 2px rgba(224, 71, 60, 0.12);
    }

    input[readonly] {
      color: var(--muted-text);
      cursor: not-allowed;
    }

    .toggle-row {
      padding: 16px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: var(--surface-strong);
    }

    .toggle-control {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--light-text);
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
    }

    .toggle-control input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary-color);
      flex: 0 0 auto;
    }

    .profile-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      color: var(--muted-text);
      font-size: 13px;
    }

    .profile-meta span {
      min-width: 0;
    }

    .profile-meta strong {
      display: block;
      margin-top: 4px;
      color: var(--light-text);
      font-size: 14px;
      font-weight: 700;
    }

    .verification-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border: 1px solid rgba(74, 222, 128, 0.3);
      border-radius: 999px;
      background: rgba(74, 222, 128, 0.1);
      color: var(--ok);
      font-size: 12px;
      white-space: nowrap;
    }

    .verification-badge.unverified-badge {
      border-color: rgba(255, 165, 0, 0.3);
      background: rgba(255, 165, 0, 0.1);
      color: #ffa500;
    }

    .profile-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--line-soft);
    }

    .btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border: 2px solid transparent;
      border-radius: 8px;
      font: 700 13px/1 Inter, sans-serif;
      cursor: pointer;
      text-decoration: none;
    }

    .btn.primary {
      border-color: #a2362f;
      background: linear-gradient(180deg, var(--primary-gradient-start), var(--primary-gradient-mid) 48%, var(--primary-gradient-end));
      color: #fff;
      box-shadow: 0 4px 12px var(--primary-shadow);
    }

    .btn.secondary {
      border-color: var(--module-line);
      background: var(--surface-strong);
      color: var(--light-text);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.72;
    }

    #message {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    #message.success {
      border: 1px solid rgba(74, 222, 128, 0.3);
      background: rgba(74, 222, 128, 0.1);
      color: var(--ok);
    }

    #message.error {
      border: 1px solid rgba(224, 71, 60, 0.3);
      background: rgba(224, 71, 60, 0.1);
      color: var(--primary-soft);
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .avatar-row { align-items: flex-start; }
      .profile-actions {
        align-items: stretch;
        flex-direction: column;
      }
      .profile-meta { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="../../common/site-header.css">
  <link rel="stylesheet" href="../../common/site-footer.css">
  <link rel="stylesheet" href="../../common/account-shell.css">
</head>
<body class="nf-account-page">
  <div data-site-header></div>
  <script src="../../common/site-header.js" data-base="../../"></script>
  <canvas id="neural-particles" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.46;"></canvas>

  <main class="nf-account-main">
    <div class="nf-account-shell">
      <div class="nf-account-heading">
        <h1>Profile</h1>
        <p>Manage your account details</p>
      </div>

      <div id="message"></div>

      <form id="profileForm" class="nf-account-card">
        <div class="avatar-row">
          <label class="avatar" for="avatarInput" aria-label="Upload profile picture">
            <span id="avatarInitial">U</span>
            <img id="avatarImg" alt="" style="display: none;">
            <span class="avatar-upload-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 15V3"></path>
                <path d="M7 8l5-5 5 5"></path>
                <path d="M5 14v4a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-4"></path>
              </svg>
            </span>
            <input type="file" id="avatarInput" accept="image/*">
          </label>
          <div class="avatar-actions">
            <p>PNG, JPG, GIF, or WEBP. Max 5MB.</p>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="field-label" for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" autocomplete="given-name">
          </div>

          <div class="form-group">
            <label class="field-label" for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" autocomplete="family-name">
          </div>

          <div class="form-group full">
            <label class="field-label" for="email">Email Address</label>
            <input type="text" id="email" name="email" placeholder="CHANGE PROCESS PENDING" readonly>
          </div>

          <div class="form-group full">
            <label class="field-label" for="location">Location</label>
            <input type="text" id="location" name="location" autocomplete="address-level2" placeholder="Coordinates will prefill if browser location is allowed">
          </div>

          <div class="toggle-row">
            <span>Email Preferences</span>
            <label class="toggle-control" for="marketingOptOut">
              <input type="checkbox" id="marketingOptOut" name="marketingOptOut">
              Opt out of Marketing Emails
            </label>
          </div>

          <div class="profile-meta">
            <span>Member Since:<strong id="memberSince">Loading...</strong></span>
            <span>Plan:<strong id="planStatus">Loading...</strong></span>
            <span id="verificationBadge"></span>
          </div>
        </div>

        <div class="profile-actions">
          <button type="button" class="btn secondary" onclick="handleLogout()">Logout</button>
          <button type="submit" class="btn primary" id="saveProfileButton">Save Profile</button>
        </div>
      </form>
    </div>
  </main>

  <div data-site-footer></div>
  <script src="../../common/site-footer.js" data-base="../../"></script>
  <script src="../../shared/neural-particles.js"></script>

  <script>
    window.nfAuth = new window.NeurofoundryAuth({
      apiUrl: window.NeurofoundryAuth.resolveDefaultApiUrl()
    });

    if (!window.nfAuth.isAuthenticated()) {
      window.location.href = '/members/login/?redirect=' + encodeURIComponent(window.location.pathname);
    }

    let currentPreferences = {};

    function profileImageSrc(avatar) {
      if (!avatar) return '';
      if (/^https?:\/\//i.test(avatar)) return avatar;
      const apiOrigin = new URL(window.nfAuth.apiUrl).origin;
      return `${apiOrigin}${avatar}`;
    }

    function formatPlan(user) {
      const plan = (user.planTier || 'free').replace(/[_-]+/g, ' ');
      const status = (user.accountStatus || '').replace(/[_-]+/g, ' ');
      const planLabel = plan.replace(/\b\w/g, (letter) => letter.toUpperCase());
      const statusLabel = status ? status.replace(/\b\w/g, (letter) => letter.toUpperCase()) : '';
      return statusLabel ? `${planLabel} - ${statusLabel}` : planLabel;
    }

    function tryPrefillLocation() {
      const locationInput = document.getElementById('location');
      if (locationInput.value.trim() || !navigator.geolocation) return;

      navigator.geolocation.getCurrentPosition(
        (position) => {
          if (locationInput.value.trim()) return;
          const latitude = position.coords.latitude.toFixed(5);
          const longitude = position.coords.longitude.toFixed(5);
          locationInput.value = `${latitude}, ${longitude}`;
        },
        () => {},
        {
          enableHighAccuracy: false,
          timeout: 5000,
          maximumAge: 300000
        }
      );
    }

    async function loadProfile() {
      try {
        const response = await window.nfAuth.apiRequest('/profile');
        const user = response.data.profile;
        const preferences = user.preferences || {};
        currentPreferences = {
          howHeardAboutNeurofoundry: '',
          ...preferences
        };
        const avatarImg = document.getElementById('avatarImg');
        const avatarInitial = document.getElementById('avatarInitial');

        if (user.avatar) {
          avatarImg.src = profileImageSrc(user.avatar);
          avatarImg.style.display = 'block';
          avatarInitial.style.display = 'none';
        } else {
          avatarImg.style.display = 'none';
          avatarInitial.style.display = 'block';
          avatarInitial.textContent = (user.firstName || 'N')[0].toUpperCase();
        }

        const date = user.createdAt ? new Date(user.createdAt) : null;
        document.getElementById('memberSince').textContent = date && !Number.isNaN(date.valueOf())
          ? date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
          : 'Unknown';
        document.getElementById('planStatus').textContent = formatPlan(user);

        document.getElementById('verificationBadge').innerHTML = user.emailVerified
          ? '<span class="verification-badge">Email Verified</span>'
          : '<span class="verification-badge unverified-badge">Email Not Verified</span>';

        document.getElementById('firstName').value = user.firstName || '';
        document.getElementById('lastName').value = user.lastName || '';
        document.getElementById('email').value = '';
        document.getElementById('email').placeholder = 'CHANGE PROCESS PENDING';
        document.getElementById('email').dataset.currentEmail = user.email || '';
        document.getElementById('location').value = user.location || '';
        document.getElementById('marketingOptOut').checked = !!preferences.marketingOptOut;
        tryPrefillLocation();
      } catch (error) {
        console.error('Error loading profile:', error);
        showMessage('Failed to load profile.', 'error');
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const saveButton = document.getElementById('saveProfileButton');
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();

      saveButton.disabled = true;
      saveButton.textContent = 'Saving...';

      try {
        await window.nfAuth.updateProfile({
          firstName,
          lastName,
          name: `${firstName} ${lastName}`.trim()
        });

        await window.nfAuth.apiRequest('/user/preferences', {
          method: 'PATCH',
          body: JSON.stringify({
            preferences: {
              ...currentPreferences,
              howHeardAboutNeurofoundry: currentPreferences.howHeardAboutNeurofoundry || '',
              location: document.getElementById('location').value.trim(),
              marketingOptOut: document.getElementById('marketingOptOut').checked
            }
          })
        });

        showMessage('Profile saved.', 'success');
        loadProfile();
      } catch (error) {
        showMessage(error.message || 'Failed to save profile.', 'error');
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = 'Save Profile';
      }
    });

    document.getElementById('avatarInput').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        showMessage('File size must be less than 5MB.', 'error');
        return;
      }

      try {
        await window.nfAuth.uploadAvatar(file);
        showMessage('Profile picture saved.', 'success');
        loadProfile();
      } catch (error) {
        showMessage(error.message || 'Failed to upload profile picture.', 'error');
      } finally {
        event.target.value = '';
      }
    });

    async function handleLogout() {
      if (confirm('Are you sure you want to logout?')) {
        await window.nfAuth.logout();
        window.location.href = '/home.html';
      }
    }

    function showMessage(text, type) {
      const message = document.getElementById('message');
      message.textContent = text;
      message.className = type;
      message.style.display = 'block';
      setTimeout(() => {
        message.style.display = 'none';
      }, 5000);
    }

    loadProfile();
  </script>
</body>
</html>
