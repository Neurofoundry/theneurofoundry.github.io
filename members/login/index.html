<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Neurofoundry</title>
  <meta name="description" content="Access your Neurofoundry account.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="../../anvil.png">
  <link rel="apple-touch-icon" href="../../anvil.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="/auth-client.js?v=20260814a"></script>
  <style>
    :root {
      --primary-color: #e0473c;
      --primary-gradient-start: #ff7b6e;
      --primary-gradient-mid: #e9584d;
      --primary-gradient-end: #b8322b;
      --primary-soft: #ffb5ad;
      --primary-border: rgba(224, 71, 60, 0.24);
      --primary-border-strong: rgba(224, 71, 60, 0.44);
      --primary-shadow: rgba(224, 71, 60, 0.18);
      --dark-bg: #090b0d;
      --surface: #12161a;
      --surface-strong: #0f1113;
      --surface-footer: #0b0d10;
      --line: #2a2f35;
      --line-soft: #20262c;
      --module-line: #2c333a;
      --dark-overlay: #0f1113;
      --light-text: #e7ebef;
      --muted-text: #9aa3ad;
      --page-max: 100%;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      padding-top: 64px;
      display: flex;
      flex-direction: column;
      background: var(--dark-bg);
      color: var(--light-text);
      font-family: Inter, sans-serif;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 26%, rgba(70, 76, 84, 0.3), transparent 38%),
        radial-gradient(circle at 18% 72%, rgba(224, 71, 60, 0.08), transparent 30%),
        radial-gradient(circle at 82% 70%, rgba(246, 177, 122, 0.05), transparent 26%);
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      max-width: var(--page-max);
      margin: 0 auto;
      padding: 0 clamp(14px, 3vw, 24px);
      width: 100%;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--light-text);
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
      white-space: nowrap;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-gradient-start), var(--primary-color));
      color: #fff;
      font-weight: 900;
    }
    .links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: clamp(8px, 2vw, 20px);
      margin-left: auto;
    }
    .navlink, .dropdown-toggle {
      color: #ccc;
      font: 500 clamp(11px, 2vw, 14px)/1 Inter, sans-serif;
      text-decoration: none;
    }
    .navlink:hover, .dropdown-toggle:hover, .dropdown-toggle:focus-visible { color: var(--primary-color); }
    .nav-item { position: relative; }
    .dropdown-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 200px;
      padding: 10px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 50;
      background: var(--surface-strong);
      border: 1px solid var(--module-line);
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.36);
    }
    .dropdown::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      height: 10px;
    }
    .dropdown-menu a {
      display: flex;
      padding: 8px 10px;
      border-radius: 8px;
      color: #d6d6d6;
      text-decoration: none;
      font-size: 13px;
    }
    .dropdown-menu a:hover { background: rgba(224, 71, 60, 0.15); color: #fff; }
    .dropdown:hover .dropdown-menu, .dropdown:focus-within .dropdown-menu {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border: 2px solid #a2362f;
      border-radius: 8px;
      background: linear-gradient(180deg, var(--primary-gradient-start), var(--primary-gradient-mid) 48%, var(--primary-gradient-end));
      color: #fff;
      font: 600 13px/1 Inter, sans-serif;
      text-decoration: none;
      box-shadow: 0 4px 12px var(--primary-shadow);
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(28px, 6vw, 64px) clamp(14px, 3vw, 24px);
      position: relative;
      z-index: 1;
    }
    [data-site-footer] {
      position: relative;
      z-index: 1;
    }
    .login-container { width: 100%; max-width: min(420px, 100%); }
    .login-header { text-align: center; margin-bottom: clamp(24px, 5vw, 40px); }
    .login-header h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #d6dde5 42%, var(--primary-soft) 72%, var(--primary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-header p { margin: 0; color: var(--muted-text); font-size: 14px; }
    .login-form, .modal-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.26);
    }
    .login-form { padding: clamp(24px, 5vw, 32px); }
    .form-group { margin-bottom: 20px; }
    .form-group:last-of-type { margin-bottom: 24px; }
    label {
      display: block;
      margin-bottom: 8px;
      color: #c9d0d8;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--module-line);
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--light-text);
      font: 14px/1.3 Inter, sans-serif;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--primary-color);
      background: #0b0d10;
      box-shadow: 0 0 0 2px rgba(224, 71, 60, 0.12);
    }
    input::placeholder { color: #626b73; }
    .form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
      font-size: 13px;
    }
    .checkbox-wrapper { display: flex; align-items: center; gap: 8px; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary-color); cursor: pointer; }
    .checkbox-wrapper label {
      margin: 0;
      color: var(--muted-text);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      cursor: pointer;
    }
    .forgot-password, .signup-link a {
      color: var(--primary-color);
      font-weight: 600;
      text-decoration: none;
    }
    .forgot-password:hover, .signup-link a:hover { color: var(--primary-soft); }
    .login-btn {
      width: 100%;
      padding: 12px 18px;
      border: 2px solid #a2362f;
      border-radius: 8px;
      background: linear-gradient(180deg, var(--primary-gradient-start), var(--primary-gradient-mid) 48%, var(--primary-gradient-end));
      color: #fff;
      font: 700 14px/1 Inter, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--primary-shadow);
    }
    .login-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(224, 71, 60, 0.24); }
    .login-btn:disabled { cursor: not-allowed; opacity: 0.72; transform: none; }
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px 0;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line-soft);
    }
    .divider-text {
      color: var(--muted-text);
      font-size: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .social-login {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--module-line);
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--light-text);
      font: 600 13px/1 Inter, sans-serif;
      cursor: pointer;
    }
    .social-btn:hover { border-color: var(--primary-color); background: rgba(224, 71, 60, 0.1); }
    .social-btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .signup-link {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--line-soft);
      color: var(--muted-text);
      font-size: 13px;
      text-align: center;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.78);
    }
    .modal-backdrop.is-open { display: flex; }
    .modal-panel {
      position: relative;
      width: min(420px, 100%);
      padding: 28px;
    }
    .modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border: 1px solid var(--module-line);
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--light-text);
      cursor: pointer;
      font-size: 18px;
    }
    .modal-panel h2 { margin: 0 0 10px; font-size: 22px; }
    .modal-panel p { margin: 0 0 20px; color: var(--muted-text); font-size: 14px; line-height: 1.5; }
    .modal-status { min-height: 20px; margin-top: 14px; color: #4ade80; font-size: 13px; line-height: 1.5; }
    @media (max-width: 760px) {
      .brand span { display: none; }
      .links { gap: 10px; }
      .navlink:nth-of-type(n+3), .nav-item { display: none; }
      .btn { padding: 6px 12px; font-size: 11px; }
    }
    @media (max-width: 640px) {
      body { padding-top: 58px; }
      main { padding: 24px 14px; }
      .social-login { grid-template-columns: 1fr; }
      .form-footer { align-items: flex-start; flex-direction: column; }
    }
  </style>
  <link rel="stylesheet" href="../../common/site-header.css?v=20260519b">
  <link rel="stylesheet" href="../../common/site-footer.css">

</head>
<body class="nf-account-page">
  <div data-site-header></div>
  <script src="../../common/site-header.js?v=20260603-mobile-logout" data-base="../../"></script>
  <canvas id="neural-particles" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.46;"></canvas>

  <main class="nf-account-main">
    <div class="login-container nf-account-shell">
      <div class="login-header nf-account-heading">
        <h1>Welcome Back</h1>
        <p>Enter your credentials to access the foundry</p>
      </div>

      <form class="login-form nf-account-card" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="user@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••••••" autocomplete="current-password" required>
        </div>

        <div class="form-footer">
          <div class="checkbox-wrapper">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Stay connected</label>
          </div>
          <a href="#forgot-password" class="forgot-password" onclick="openForgotPassword(event)">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">LOGIN</button>

        <div class="divider">
          <span class="divider-text">or authenticate via</span>
        </div>

        <div class="social-login">
          <button type="button" class="social-btn" onclick="handleSocialLogin('google')" aria-label="Continue with Google">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06L5.84 9.9C6.71 7.3 9.14 5.38 12 5.38z"/></svg>
            Google
          </button>
          <button type="button" class="social-btn" onclick="handleSocialLogin('github')" aria-label="Continue with GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.58.1.79-.25.79-.56v-2.15c-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .98-.31 3.18 1.18A11.02 11.02 0 0 1 12 6.05c.98 0 1.96.13 2.88.39 2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.07.78 2.16v3.13c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
            GitHub
          </button>
        </div>

        <div class="signup-link">
          New to Neurofoundry? <a href="../signup/">Sign Up Here</a>
        </div>
      </form>
    </div>
  </main>

  <div class="modal-backdrop" id="forgotModal" role="dialog" aria-modal="true" aria-labelledby="forgotTitle">
    <div class="modal-panel">
      <button class="modal-close" type="button" onclick="closeForgotPassword()" aria-label="Close">x</button>
      <h2 id="forgotTitle">Forgot Password?</h2>
      <p>Enter your account email and we will send reset instructions.</p>
      <form onsubmit="submitForgotPassword(event)">
        <div class="form-group">
          <label for="forgotEmail">Email Address</label>
          <input type="email" id="forgotEmail" placeholder="user@example.com" autocomplete="email" required>
        </div>
        <button type="submit" class="login-btn" id="forgotSubmit">SEND REQUEST</button>
        <div class="modal-status" id="forgotStatus"></div>
      </form>
    </div>
  </div>
  <div data-site-footer></div>
  <script src="../../common/site-footer.js?v=20260519-footer" data-base="../../"></script>
  <script src="../../shared/neural-particles.js"></script>

  <script>
    const auth = new window.NeurofoundryAuth({
      apiUrl: window.NeurofoundryAuth.resolveDefaultApiUrl()
    });

    function getSafeRedirect() {
      const fallback = '/members/profile/';
      const rawRedirect = new URLSearchParams(window.location.search).get('redirect');
      if (!rawRedirect) return fallback;

      try {
        if (rawRedirect.startsWith('/') && !rawRedirect.startsWith('//')) {
          return rawRedirect;
        }

        const redirectUrl = new URL(rawRedirect);
        if (redirectUrl.protocol === 'https:' && redirectUrl.hostname.endsWith('theneurofoundry.com')) {
          return redirectUrl.href;
        }
      } catch (_) {
        return fallback;
      }

      return fallback;
    }

    async function redirectAuthenticatedUser() {
      if (auth.isAuthenticated()) {
        window.location.replace(getSafeRedirect());
        return;
      }

      try {
        const profile = await auth.apiRequest('/profile');
        if (profile && profile.success) window.location.replace(getSafeRedirect());
      } catch (_) {
      }
    }

    redirectAuthenticatedUser();

    async function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = event.target.querySelector('.login-btn');

      loginBtn.disabled = true;
      loginBtn.textContent = 'CONNECTING...';

      try {
        await auth.login(email, password);
        window.location.href = getSafeRedirect();
      } catch (error) {
        loginBtn.disabled = false;
        loginBtn.textContent = 'LOGIN';
        alert('Login failed: ' + (error.message || 'Invalid credentials. Please check your email and password.'));
      }
    }

    async function handleSocialLogin(provider) {
      const redirect = getSafeRedirect();

      if (redirect.includes('/checkout/reticon-v2/')) {
        const oauthUrl = new URL(`${auth.apiUrl}/auth/${provider}`);
        oauthUrl.searchParams.set('redirect', redirect);
        window.location.href = oauthUrl.toString();
        return;
      }

      try {
        await auth.loginWithOAuth(provider, redirect);
        window.location.href = redirect;
      } catch (error) {
        alert('OAuth login failed: ' + (error.message || 'Could not connect to ' + provider));
      }
    }

    function openForgotPassword(event) {
      event.preventDefault();
      const currentEmail = document.getElementById('email').value.trim();
      document.getElementById('forgotEmail').value = currentEmail;
      document.getElementById('forgotStatus').textContent = '';
      document.getElementById('forgotModal').classList.add('is-open');
      setTimeout(() => document.getElementById('forgotEmail').focus(), 0);
    }

    function closeForgotPassword() {
      document.getElementById('forgotModal').classList.remove('is-open');
    }

    async function submitForgotPassword(event) {
      event.preventDefault();

      const email = document.getElementById('forgotEmail').value.trim();
      const button = document.getElementById('forgotSubmit');
      const status = document.getElementById('forgotStatus');

      button.disabled = true;
      button.textContent = 'SENDING...';
      status.textContent = '';

      try {
        await auth.forgotPassword(email);
        status.textContent = 'Request Sent! Please check your email for instructions.';
      } catch (error) {
        console.warn('Password reset request failed:', error);
        status.textContent = 'Request Sent! Please check your email for instructions.';
      } finally {
        button.disabled = false;
        button.textContent = 'SEND REQUEST';
      }
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeForgotPassword();
    });

    document.getElementById('forgotModal').addEventListener('click', (event) => {
      if (event.target.id === 'forgotModal') closeForgotPassword();
    });
  </script>
  <script src="../../shared/page-transitions.js"></script>
  <script src="../../shared/micro-interactions.js"></script>
  <script src="../../embers-effect.js"></script>
</body>
</html>
