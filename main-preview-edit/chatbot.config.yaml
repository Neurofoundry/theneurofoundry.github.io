# Chatbot configuration
# Place this file at the site root (served as /chatbot.config.yaml)
# Available keys (all optional):
#   endpoint: URL to POST chat requests to (string)
#   initial_message: initial bot greeting (string)
#   placeholder: input placeholder text (string)
#   window_width: width in pixels (number)
#   window_height: height in pixels (number)
#   accent1: first accent color (hex string)
#   accent2: second accent color (hex string)
#   bg: background color for the chat window (CSS color)
#   enable_tracing: boolean
#   typing_text: text to show while typing
#   error_message: friendly error message

endpoint: "https://eden-chat.csirico9.workers.dev"
initial_message: "Hello! I'm your Neurofoundry AI assistant. How can I help you today?"
placeholder: "Type your message..."
window_width: 300
window_height: 360
accent1: "#ff7b6e"
accent2: "#e0473c"
bg: "rgba(15, 17, 19, 0.98)"
enable_tracing: true
typing_text: "Typing..."
error_message: "Sorry, I'm having trouble connecting. Please try again."

# Fuzzy matching:
# match_fuzzy: enable or disable fuzzy matching (true/false)
# fuzzy_threshold: normalized similarity threshold (0..1, default 0.8)
# fuzzy_whole_word: when true, compare rules to each token in user input rather than the whole input
match_fuzzy: true
fuzzy_threshold: 0.8
fuzzy_whole_word: true

# Personality configuration
# personality:
